      <circle cx="24" cy="7" r="10" fill="#8b8f7d" stroke="#28302c" stroke-width="4"/>
      <circle cx="-18" cy="11" r="8" fill="#536059" stroke="#1b2220" stroke-width="4"/>
      <circle cx="3" cy="0" r="5" fill="#18201f"/>
      <circle cx="26" cy="6" r="3" fill="#252b27"/>
    </g>

