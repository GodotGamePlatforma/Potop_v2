<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3840" viewBox="0 0 2400 3840">
  <defs>
    <linearGradient id="concreteBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53605d"/>
      <stop offset="0.2" stop-color="#36413f"/>
      <stop offset="0.58" stop-color="#202b2b"/>
      <stop offset="1" stop-color="#101a1d"/>
