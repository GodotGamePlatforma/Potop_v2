<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="3680" viewBox="0 0 2240 3680">
  <defs>
    <linearGradient id="backwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#214354"/><stop offset=".36" stop-color="#112e3d"/>
      <stop offset=".72" stop-color="#09222e"/><stop offset="1" stop-color="#061821"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030e14"/><stop offset=".14" stop-color="#1d3945"/>
      <stop offset=".5" stop-color="#071a24"/><stop offset=".86" stop-color="#1d3945"/><stop offset="1" stop-color="#030e14"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#657881"/><stop offset=".14" stop-color="#344b55"/>
      <stop offset=".7" stop-color="#172c35"/><stop offset="1" stop-color="#0a1c24"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76909a"/><stop offset=".28" stop-color="#2f4d58"/>
      <stop offset=".68" stop-color="#162e38"/><stop offset="1" stop-color="#071820"/>
