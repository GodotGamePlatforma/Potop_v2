    <linearGradient id="wetFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233f49"/><stop offset=".45" stop-color="#0e2d3b"/>
      <stop offset="1" stop-color="#071a25"/>
    </linearGradient>
    <pattern id="wallPanels" width="240" height="280" patternUnits="userSpaceOnUse">
      <rect width="240" height="280" fill="url(#backwall)"/>
      <path d="M0 18H240M0 262H240M18 0V280M222 0V280" stroke="#66808b" stroke-opacity=".28" stroke-width="5"/>
      <path d="M34 214H206" stroke="#96abb1" stroke-opacity=".14" stroke-width="8"/>
      <circle cx="36" cy="38" r="6" fill="#a2b3b6" fill-opacity=".35"/><circle cx="204" cy="38" r="6" fill="#a2b3b6" fill-opacity=".35"/>
    </pattern>
    <pattern id="archiveGrid" width="140" height="120" patternUnits="userSpaceOnUse">
      <rect width="140" height="120" fill="#102936"/>
      <rect x="8" y="8" width="124" height="104" rx="4" fill="#182f3a" stroke="#637b84" stroke-opacity=".48" stroke-width="5"/>
      <path d="M18 40H122M18 74H122" stroke="#7c552f" stroke-width="8"/>
      <rect x="24" y="18" width="36" height="18" fill="#8d6338"/><rect x="68" y="50" width="45" height="18" fill="#75624b"/><rect x="28" y="84" width="58" height="18" fill="#8b693d"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dy="12" result="offset"/>
      <feFlood flood-color="#01070a" flood-opacity=".88" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wallNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".015 .075" numOctaves="3" seed="73" result="n"/>
      <feColorMatrix in="n" type="matrix" values=".22 0 0 0 .03  0 .3 0 0 .04  0 0 .34 0 .05  0 0 0 .22 0" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>

  <rect width="2240" height="3680" fill="url(#wallPanels)"/>
  <rect width="2240" height="3680" fill="#04131b" opacity=".12"/>

