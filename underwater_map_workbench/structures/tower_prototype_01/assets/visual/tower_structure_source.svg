      <feFlood flood-color="#01080b" flood-opacity=".85" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/>
      <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
