name: Agent branch feedback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: agent-feedback-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref }}

jobs:
  fast-feedback:
    name: Agent fast feedback
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify exact candidate and LF contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actualHead = (git rev-parse "HEAD^{commit}" | Out-String).Trim()
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or $actualHead -cne $env:TARGET_SHA) {
            throw "Candidate checkout is not bound to the exact event SHA."
          }
          if ($env:BASE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "Candidate event has no exact base SHA."
          }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Candidate feedback checkout is not clean."
          }
          python -B tools/workbench_contract.py --repo . eol-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:BASE_SHA $env:TARGET_SHA --
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate PR owner route
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B tools/ci_branch_owner.py validate `
            --repo . `
            --branch $env:HEAD_BRANCH `
            --base-ref $env:BASE_SHA `
            --expected-base $env:BASE_SHA `
            --expected-head $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run secretless fast feedback contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tests = @(
            Get-Item -LiteralPath "tests/agent_integration_workflow_test.py"
            Get-ChildItem -LiteralPath tests -File -Filter "ci_*_test.py" |
              ForEach-Object { $_ }
          ) | Sort-Object -Property Name
          if ($tests.Count -eq 0) { throw "No CI feedback tests were discovered." }
          foreach ($test in $tests) {
            python -B $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in @(
            "tests/publish_agent_pr_test.ps1",
            "tests/sync_play_main_test.ps1"
          )) {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Preserve exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse "HEAD^{commit}" | Out-String).Trim() -cne $env:TARGET_SHA) {
            throw "Fast feedback changed HEAD."
          }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Fast feedback changed the candidate checkout."
          }
