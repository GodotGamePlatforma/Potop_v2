name: Agent branch validation

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  fast-contract:
    name: Agent fast contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify immutable source and LF contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $actualHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHead -cne $env:GITHUB_SHA) {
            throw "Checkout HEAD does not match GITHUB_SHA. expected=$env:GITHUB_SHA actual=$actualHead"
          }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Agent validation checkout is not clean."
          }

          python -B tools/workbench_contract.py --repo . eol-check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate the complete committed owner diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          git fetch --no-tags origin `
            +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python -B tools/ci_branch_owner.py validate `
            --repo . `
            --branch $env:GITHUB_REF_NAME `
            --base-ref refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run fast CI contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $tests = @(
            Get-Item -LiteralPath "tests/agent_integration_workflow_test.py"
            Get-ChildItem -LiteralPath tests -File -Filter "ci_*_test.py" |
              ForEach-Object { $_ }
          ) | Sort-Object -Property Name
          if ($tests.Count -eq 0) {
            throw "No CI contract tests were discovered."
          }

          $python = (Get-Command python -ErrorAction Stop).Source
          $running = [System.Collections.Generic.List[object]]::new()
          foreach ($test in $tests) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $python
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.CreateNoWindow = $true
            [void]$startInfo.ArgumentList.Add("-B")
            [void]$startInfo.ArgumentList.Add($test.FullName)
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Could not start CI contract: $($test.Name)"
            }
            $running.Add([pscustomobject]@{
              Name = $test.Name
              Process = $process
              Stdout = $process.StandardOutput.ReadToEndAsync()
              Stderr = $process.StandardError.ReadToEndAsync()
            })
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($entry in $running) {
            $entry.Process.WaitForExit()
            $stdout = $entry.Stdout.GetAwaiter().GetResult()
            $stderr = $entry.Stderr.GetAwaiter().GetResult()
            Write-Host "CI CONTRACT: $($entry.Name) exit=$($entry.Process.ExitCode)"
            if (-not [string]::IsNullOrWhiteSpace($stdout)) { Write-Host $stdout.TrimEnd() }
            if (-not [string]::IsNullOrWhiteSpace($stderr)) { Write-Host $stderr.TrimEnd() }
            if ($entry.Process.ExitCode -ne 0) { $failures.Add($entry.Name) }
            $entry.Process.Dispose()
          }
          if ($failures.Count -gt 0) {
            throw "CI contract failures: $([string]::Join(', ', $failures))"
          }
