name: Agent branch validation

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  fast-contract:
    name: Agent fast contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify immutable source and LF contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $actualHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHead -cne $env:GITHUB_SHA) {
            throw "Checkout HEAD does not match GITHUB_SHA. expected=$env:GITHUB_SHA actual=$actualHead"
          }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Agent validation checkout is not clean."
          }

          python -B tools/workbench_contract.py --repo . eol-check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate the complete committed owner diff
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          git fetch --no-tags origin `
            +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python -B tools/ci_branch_owner.py validate `
            --repo . `
            --branch $env:GITHUB_REF_NAME `
            --base-ref refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run fast CI contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $tests = @(
            Get-ChildItem -LiteralPath tests -File -Filter "ci_*_test.py" |
              Sort-Object -Property Name
          )
          if ($tests.Count -eq 0) {
            throw "No CI contract tests were discovered."
          }

          foreach ($test in $tests) {
            Write-Host "CI CONTRACT: $($test.Name)"
            python -B $test.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
