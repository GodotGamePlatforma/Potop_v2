name: Agent fast-check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: agent-fast-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_NAME: Godot_v4.7.1-stable_win64.exe.zip
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
  GODOT_ARCHIVE_SHA256: c7a289051eaefb460b0106b60e9cd5bee0ef55fd102dcb2bed1eb356cf3d90a1

jobs:
  fast-check:
    name: fast-check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP $env:GODOT_ARCHIVE_NAME
          $install = Join-Path $env:RUNNER_TEMP "godot-fast-check"
          Invoke-WebRequest -Uri $env:GODOT_RELEASE_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GODOT_ARCHIVE_SHA256) {
            throw "Godot archive checksum mismatch. expected=$env:GODOT_ARCHIVE_SHA256 actual=$actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $godot = Join-Path $install "Godot_v4.7.1-stable_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Pinned Godot executable is missing."
          }
          "GODOT_CONSOLE_PATH=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the canonical fast-check
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $env:EXPECTED_HEAD) {
            throw "Checkout is not the exact PR head. expected=$env:EXPECTED_HEAD actual=$actualHead"
          }
          & ./tools/agent_fast_check.ps1 `
            -Repository . `
            -BaseRef refs/remotes/origin/main `
            -GodotConsolePath $env:GODOT_CONSOLE_PATH `
            -AllowControlPlane
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
