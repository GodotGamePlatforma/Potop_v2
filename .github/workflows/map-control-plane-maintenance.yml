name: Map control-plane maintenance authorization

# This workflow is loaded only from main. It authorizes exactly three map
# verifier paths after an explicit protected-environment approval; it never
# executes candidate-controlled code and never merges the PR. The current
# personal repository has one maintainer, so this is deliberately a one-person
# manual trust lane, not a claimed two-person review.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact same-repository PR number
        required: true
        type: string
      base_sha:
        description: Exact current main SHA
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      evidence_sha256:
        description: SHA-256 of the reviewed external evidence bundle
        required: true
        type: string
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  inspect:
    name: Inspect exact map verifier update
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr-number: ${{ steps.inspect.outputs.pr-number }}
      base-sha: ${{ steps.inspect.outputs.base-sha }}
      candidate-sha: ${{ steps.inspect.outputs.candidate-sha }}
      builder-sha256: ${{ steps.inspect.outputs.builder-sha256 }}
      portal-test-sha256: ${{ steps.inspect.outputs.portal-test-sha256 }}
      smoke-test-sha256: ${{ steps.inspect.outputs.smoke-test-sha256 }}
      evidence-sha256: ${{ steps.inspect.outputs.evidence-sha256 }}
      authorization-sha256: ${{ steps.inspect.outputs.authorization-sha256 }}
    steps:
      - name: Check out trusted main control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate exact PR and create authorization commitment
        id: inspect
        shell: pwsh
        env:
          REQUESTED_PR: ${{ inputs.pr_number }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUESTED_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "Map control-plane maintenance must be dispatched from main."
          }
          if ($env:GITHUB_SHA -cne $env:REQUESTED_BASE_SHA) {
            throw "workflow_dispatch SHA is not the exact requested main base."
          }
          if ($env:REQUESTED_BASE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:REQUESTED_CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:REQUESTED_EVIDENCE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "Maintenance inputs contain a malformed immutable digest."
          }
          $pullNumber = 0
          if (-not [int]::TryParse($env:REQUESTED_PR, [ref]$pullNumber) -or $pullNumber -lt 1) {
            throw "pr_number must be a positive integer."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repository = $env:GITHUB_REPOSITORY
          $main = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/commits/main" -Headers $headers
          $pull = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/pulls/$pullNumber" -Headers $headers
          if ($main.sha -cne $env:REQUESTED_BASE_SHA -or
              $pull.state -cne "open" -or $pull.draft -or
              $pull.base.ref -cne "main" -or $pull.base.sha -cne $env:REQUESTED_BASE_SHA -or
              $pull.head.repo.full_name -cne $repository -or $pull.head.sha -cne $env:REQUESTED_CANDIDATE_SHA) {
            throw "PR, main or immutable maintenance input moved before inspection."
          }
          if ($pull.head.ref -cnotmatch '^codex/map/[a-z0-9][a-z0-9._-]*$') {
            throw "Map maintenance requires a strict codex/map task branch."
          }
          $labels = @($pull.labels | ForEach-Object { [string]$_.name })
          if ("control-plane-reviewed" -cnotin $labels) {
            throw "PR is missing the control-plane-reviewed label."
          }

          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $gitCommand = Get-Command -Name git.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $trustedGit = [System.IO.Path]::GetFullPath($gitCommand.Source)
          foreach ($untrustedRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $prefix = [System.IO.Path]::GetFullPath($untrustedRoot).TrimEnd([char[]]"\/") + [System.IO.Path]::DirectorySeparatorChar
            if ($trustedGit.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Git executable resolved inside an untrusted workspace: $trustedGit"
            }
          }
          $neutralCwd = Join-Path $env:RUNNER_TEMP "map-maintenance-neutral-cwd"
          New-Item -ItemType Directory -Path $neutralCwd -Force | Out-Null
          if (@(Get-ChildItem -LiteralPath $neutralCwd -Force).Count -ne 0) {
            throw "Map-maintenance neutral working directory is not empty."
          }
          $env:CI_TRUSTED_GIT = $trustedGit
          $trustedHead = (& $trustedGit -C $trustedRoot rev-parse "HEAD^{commit}" | Out-String).Trim()
          $candidateHead = (& $trustedGit -C $candidateRoot rev-parse "HEAD^{commit}" | Out-String).Trim()
          if ($trustedHead -cne $env:REQUESTED_BASE_SHA -or $candidateHead -cne $env:REQUESTED_CANDIDATE_SHA) {
            throw "Checked-out maintenance commits do not match the immutable inputs."
          }
          & python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --script (Join-Path $trustedRoot "tools/ci_protected_paths.py") -- validate-map-maintenance-diff `
            --repo $candidateRoot --base $env:REQUESTED_BASE_SHA --head $env:REQUESTED_CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --script (Join-Path $trustedRoot "tools/ci_branch_owner.py") -- validate `
            --repo $candidateRoot --branch ([string]$pull.head.ref) `
            --base-ref $env:REQUESTED_BASE_SHA `
            --expected-head $env:REQUESTED_CANDIDATE_SHA `
            --expected-base $env:REQUESTED_BASE_SHA `
            --contract-tool (Join-Path $trustedRoot "tools/workbench_contract.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $builderSha = (Get-FileHash -LiteralPath (Join-Path $candidateRoot "underwater_map_workbench/tools/build_underwater_map.py") -Algorithm SHA256).Hash.ToLowerInvariant()
          $portalSha = (Get-FileHash -LiteralPath (Join-Path $candidateRoot "underwater_map_workbench/tests/portal_backdrop_clearance_test.py") -Algorithm SHA256).Hash.ToLowerInvariant()
          $smokeSha = (Get-FileHash -LiteralPath (Join-Path $candidateRoot "underwater_map_workbench/tests/underwater_map_smoke_test.gd") -Algorithm SHA256).Hash.ToLowerInvariant()
          $authorizationPayload = "map-control-plane-authorization-v1`nrepo=$repository`npr=$pullNumber`nbase=$($env:REQUESTED_BASE_SHA)`nhead=$($env:REQUESTED_CANDIDATE_SHA)`nbuilder=$builderSha`nportal=$portalSha`nsmoke=$smokeSha`nevidence=$($env:REQUESTED_EVIDENCE_SHA256)`n"
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $authorizationSha = [Convert]::ToHexString(
              $hasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($authorizationPayload))
            ).ToLowerInvariant()
          }
          finally { $hasher.Dispose() }

          "pr-number=$pullNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base-sha=$($env:REQUESTED_BASE_SHA)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate-sha=$($env:REQUESTED_CANDIDATE_SHA)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "builder-sha256=$builderSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portal-test-sha256=$portalSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "smoke-test-sha256=$smokeSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "evidence-sha256=$($env:REQUESTED_EVIDENCE_SHA256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "authorization-sha256=$authorizationSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  authorize:
    name: Human-authorize exact map verifier update
    needs:
      - inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: control-plane-maintenance
    concurrency:
      group: map-control-plane-authorize-${{ needs.inspect.outputs.pr-number }}-${{ needs.inspect.outputs.candidate-sha }}-${{ needs.inspect.outputs.authorization-sha256 }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
    steps:
      - name: Mint repository-scoped attester token
        id: attester-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRATION_ATTESTER_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_ATTESTER_PRIVATE_KEY }}
          permission-checks: write

      - name: Revalidate, queue exact check and dispatch secretless certification
        shell: pwsh
        env:
          PR_NUMBER: ${{ needs.inspect.outputs.pr-number }}
          BASE_SHA: ${{ needs.inspect.outputs.base-sha }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate-sha }}
          BUILDER_SHA256: ${{ needs.inspect.outputs.builder-sha256 }}
          PORTAL_TEST_SHA256: ${{ needs.inspect.outputs.portal-test-sha256 }}
          SMOKE_TEST_SHA256: ${{ needs.inspect.outputs.smoke-test-sha256 }}
          EVIDENCE_SHA256: ${{ needs.inspect.outputs.evidence-sha256 }}
          AUTHORIZATION_SHA256: ${{ needs.inspect.outputs.authorization-sha256 }}
          EXPECTED_ATTESTER_APP_ID: ${{ vars.INTEGRATION_ATTESTER_APP_ID }}
          ATTESTER_TOKEN: ${{ steps.attester-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = $env:GITHUB_REPOSITORY
          $requiredCheck = "integration-green"
          foreach ($value in @($env:BUILDER_SHA256, $env:PORTAL_TEST_SHA256, $env:SMOKE_TEST_SHA256, $env:EVIDENCE_SHA256, $env:AUTHORIZATION_SHA256)) {
            if ($value -cnotmatch '^[0-9a-f]{64}$') { throw "Authorization digest is malformed." }
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $main = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/commits/main" -Headers $headers
          $pull = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/pulls/$($env:PR_NUMBER)" -Headers $headers
          $environment = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/environments/control-plane-maintenance" -Headers $headers
          if ($main.sha -cne $env:BASE_SHA -or
              $pull.state -cne "open" -or $pull.draft -or
              $pull.base.ref -cne "main" -or $pull.base.sha -cne $env:BASE_SHA -or
              $pull.head.repo.full_name -cne $repository -or $pull.head.sha -cne $env:CANDIDATE_SHA) {
            throw "PR or main moved while waiting for protected-environment approval."
          }
          $labels = @($pull.labels | ForEach-Object { [string]$_.name })
          if ("control-plane-reviewed" -cnotin $labels) { throw "Review label was removed." }
          $reviewRules = @($environment.protection_rules | Where-Object { [string]$_.type -ceq "required_reviewers" })
          $reviewers = @($reviewRules[0].reviewers)
          $repositoryOwner = $repository.Split('/')[0]
          if ($reviewRules.Count -ne 1 -or
              [bool]$reviewRules[0].prevent_self_review -or
              $reviewers.Count -ne 1 -or
              [string]$reviewers[0].type -cne "User" -or
              [string]$reviewers[0].reviewer.login -cne $repositoryOwner) {
            throw "Solo control-plane maintenance must require exactly the repository owner and permit an explicit self-review."
          }
          $authorizationPayload = "map-control-plane-authorization-v1`nrepo=$repository`npr=$($env:PR_NUMBER)`nbase=$($env:BASE_SHA)`nhead=$($env:CANDIDATE_SHA)`nbuilder=$($env:BUILDER_SHA256)`nportal=$($env:PORTAL_TEST_SHA256)`nsmoke=$($env:SMOKE_TEST_SHA256)`nevidence=$($env:EVIDENCE_SHA256)`n"
          $hasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $authorizationSha = [Convert]::ToHexString(
              $hasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($authorizationPayload))
            ).ToLowerInvariant()
          }
          finally { $hasher.Dispose() }
          if ($authorizationSha -cne $env:AUTHORIZATION_SHA256) {
            throw "Protected-environment authorization commitment changed."
          }
          $appId = 0L
          if (-not [long]::TryParse($env:EXPECTED_ATTESTER_APP_ID, [ref]$appId) -or $appId -lt 1) {
            throw "INTEGRATION_ATTESTER_APP_ID must be a positive numeric App ID."
          }
          $attesterHeaders = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:ATTESTER_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $handoffExternalId = "control-plane-handoff-v1:$($env:PR_NUMBER):$($env:BASE_SHA):$($env:CANDIDATE_SHA):$authorizationSha"
          if ($handoffExternalId.Length -gt 255) { throw "Control-plane handoff external_id exceeds 255 characters." }
          $successPattern = "^control-plane-v2:$($env:PR_NUMBER):$($env:BASE_SHA):$($env:CANDIDATE_SHA):$($authorizationSha):[0-9a-f]{64}$"
          $familyHandoffPattern = "^control-plane-handoff-v1:$($env:PR_NUMBER):$($env:BASE_SHA):$($env:CANDIDATE_SHA):[0-9a-f]{64}$"
          $familySuccessPattern = "^control-plane-v2:$($env:PR_NUMBER):$($env:BASE_SHA):$($env:CANDIDATE_SHA):[0-9a-f]{64}:[0-9a-f]{64}$"
          function Get-MaintenanceFamilyDecision {
            param(
              [object[]]$CheckRuns,
              [string]$CandidateSha,
              [string]$HandoffExternalId,
              [string]$SuccessPattern,
              [string]$FamilyHandoffPattern,
              [string]$FamilySuccessPattern,
              [long]$ExpectedAppId
            )
            $family = @(
              $CheckRuns |
                Where-Object {
                  $_.name -ceq $requiredCheck -and
                  $_.head_sha -ceq $CandidateSha -and
                  [long]$_.app.id -eq $ExpectedAppId -and
                  ($_.external_id -cmatch $FamilyHandoffPattern -or
                   $_.external_id -cmatch $FamilySuccessPattern)
                } |
                Sort-Object -Property @{ Expression = { [long]$_.id } } -Descending
            )
            if ($family.Count -eq 0) {
              return [pscustomobject]@{ action = "queue"; check = $null }
            }
            $latest = $family[0]
            if ($latest.external_id -cmatch $SuccessPattern -and
                $latest.status -ceq "completed" -and
                $latest.conclusion -ceq "success") {
              return [pscustomobject]@{ action = "certified"; check = $latest }
            }
            if ($latest.status -ceq "queued" -and
                $latest.external_id -ceq $HandoffExternalId) {
              # A host may have died between Check Run creation and dispatch.
              return [pscustomobject]@{ action = "dispatch"; check = $latest }
            }
            # A completed failure or an in-progress lease may belong to a dead
            # executor. A manual retry creates a newer Check Run; late writers
            # remain bound to their older check_run_id and cannot win newest-family.
            return [pscustomobject]@{ action = "queue"; check = $null }
          }
          $encodedCheck = [Uri]::EscapeDataString($requiredCheck)
          $checkResponse = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$repository/commits/$($env:CANDIDATE_SHA)/check-runs?check_name=$encodedCheck&filter=all&per_page=100" `
            -Headers $attesterHeaders
          $decision = Get-MaintenanceFamilyDecision `
            -CheckRuns @($checkResponse.check_runs) `
            -CandidateSha $env:CANDIDATE_SHA `
            -HandoffExternalId $handoffExternalId `
            -SuccessPattern $successPattern `
            -FamilyHandoffPattern $familyHandoffPattern `
            -FamilySuccessPattern $familySuccessPattern `
            -ExpectedAppId $appId
          if ($decision.action -ceq "certified") {
            Write-Output "Exact map verifier authorization is already certified by the newest family check."
            exit 0
          }

          $checkPayload = @{
            name = $requiredCheck
            head_sha = $env:CANDIDATE_SHA
            external_id = $handoffExternalId
            details_url = "$env:GITHUB_SERVER_URL/$repository/actions/runs/$env:GITHUB_RUN_ID"
            status = "queued"
            output = @{
              title = "Map verifier update authorized for secretless certification"
              summary = "exact_head=$($env:CANDIDATE_SHA); authorization=$authorizationSha; evidence=$($env:EVIDENCE_SHA256)"
            }
          }
          $checkBody = $checkPayload | ConvertTo-Json -Depth 8 -Compress
          if ($decision.action -ceq "dispatch") {
            $check = $decision.check
          }
          elseif ($decision.action -ceq "queue") {
            $check = Invoke-RestMethod -Method POST -Uri "https://api.github.com/repos/$repository/check-runs" `
              -Headers $attesterHeaders -ContentType "application/json" -Body $checkBody
          }
          else {
            throw "Unknown maintenance-family action: $($decision.action)"
          }
          if ($check.name -cne $requiredCheck -or
              $check.head_sha -cne $env:CANDIDATE_SHA -or
              $check.external_id -cne $handoffExternalId -or
              [long]$check.app.id -ne $appId -or
              $check.status -cne "queued") {
            throw "Dedicated App did not return the exact queued maintenance check."
          }
          $dispatchBody = @{
            event_type = "verify-map-control-plane-candidate"
            client_payload = @{
              pr_number = [int]$env:PR_NUMBER
              base_sha = $env:BASE_SHA
              candidate_sha = $env:CANDIDATE_SHA
              check_run_id = [long]$check.id
              required_label = "control-plane-reviewed"
              authorization_sha256 = $authorizationSha
              builder_sha256 = $env:BUILDER_SHA256
              portal_test_sha256 = $env:PORTAL_TEST_SHA256
              smoke_test_sha256 = $env:SMOKE_TEST_SHA256
              evidence_sha256 = $env:EVIDENCE_SHA256
            }
          } | ConvertTo-Json -Depth 8 -Compress
          try {
            Invoke-RestMethod -Method POST -Uri "https://api.github.com/repos/$repository/dispatches" `
              -Headers $headers -ContentType "application/json" -Body $dispatchBody | Out-Null
            $runningBody = @{
              external_id = $handoffExternalId
              details_url = "$env:GITHUB_SERVER_URL/$repository/actions/runs/$env:GITHUB_RUN_ID"
              status = "in_progress"
              started_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
              output = @{
                title = "Secretless map verifier certification dispatched"
                summary = "exact_head=$($env:CANDIDATE_SHA); authorization=$authorizationSha; retrying a queued lease is safe"
              }
            } | ConvertTo-Json -Depth 8 -Compress
            $runningCheck = Invoke-RestMethod -Method PATCH `
              -Uri "https://api.github.com/repos/$repository/check-runs/$([long]$check.id)" `
              -Headers $attesterHeaders -ContentType "application/json" -Body $runningBody
            if ($runningCheck.status -cne "in_progress" -or
                $runningCheck.external_id -cne $handoffExternalId -or
                [long]$runningCheck.app.id -ne $appId) {
              throw "Dedicated App did not acknowledge the exact dispatched maintenance lease."
            }
          }
          catch {
            $failureBody = @{
              external_id = $handoffExternalId
              details_url = "$env:GITHUB_SERVER_URL/$repository/actions/runs/$env:GITHUB_RUN_ID"
              status = "completed"
              conclusion = "failure"
              completed_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
              output = @{
                title = "Map verifier certification dispatch failed"
                summary = "The exact authorization remains unmerged and may be retried safely."
              }
            } | ConvertTo-Json -Depth 8 -Compress
            Invoke-RestMethod -Method PATCH `
              -Uri "https://api.github.com/repos/$repository/check-runs/$([long]$check.id)" `
              -Headers $attesterHeaders -ContentType "application/json" -Body $failureBody | Out-Null
            throw
          }

  audit-merged-main:
    name: Dispatch exact-main audit after manual maintenance merge
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'codex/map/') && contains(github.event.pull_request.labels.*.name, 'control-plane-reviewed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: map-control-plane-audit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    permissions:
      checks: read
      contents: write
      pull-requests: read
    steps:
      - name: Verify the certified maintenance family and audit current main
        shell: pwsh
        env:
          EXPECTED_ATTESTER_APP_ID: ${{ vars.INTEGRATION_ATTESTER_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = $env:GITHUB_REPOSITORY
          $pull = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json | Select-Object -ExpandProperty pull_request
          if (-not [bool]$pull.merged -or
              $pull.base.ref -cne "main" -or
              $pull.head.repo.full_name -cne $repository -or
              [string]$pull.head.ref -cnotmatch '^codex/map/[a-z0-9][a-z0-9._-]*$' -or
              [string]$pull.head.sha -cnotmatch '^[0-9a-f]{40}$' -or
              [string]$pull.merge_commit_sha -cnotmatch '^[0-9a-f]{40}$') {
            throw "Closed event is not an exact merged same-repository map-maintenance PR."
          }
          $labels = @($pull.labels | ForEach-Object { [string]$_.name })
          if ("control-plane-reviewed" -cnotin $labels) {
            throw "Merged maintenance PR lost its required review label."
          }
          $appId = 0L
          if (-not [long]::TryParse($env:EXPECTED_ATTESTER_APP_ID, [ref]$appId) -or $appId -lt 1) {
            throw "INTEGRATION_ATTESTER_APP_ID must be a positive numeric App ID."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $pullNumber = [int]$pull.number
          $files = @()
          for ($page = 1; $page -le 2; $page++) {
            $pageFiles = @(Invoke-RestMethod -Method GET `
              -Uri "https://api.github.com/repos/$repository/pulls/$pullNumber/files?per_page=100&page=$page" `
              -Headers $headers)
            $files += $pageFiles
            if ($files.Count -gt 3) {
              throw "Merged maintenance PR contains more than three files."
            }
            if ($pageFiles.Count -lt 100) { break }
          }
          $allowed = @(
            "underwater_map_workbench/tests/portal_backdrop_clearance_test.py",
            "underwater_map_workbench/tests/underwater_map_smoke_test.gd",
            "underwater_map_workbench/tools/build_underwater_map.py"
          ) | Sort-Object
          $actual = @($files | ForEach-Object { [string]$_.filename } | Sort-Object -Unique)
          $illegalStatus = @(
            $files |
              Where-Object {
                [string]$_.status -cne "modified" -or
                -not [string]::IsNullOrEmpty([string]$_.previous_filename)
              }
          )
          if ($files.Count -lt 1 -or
              $actual.Count -ne $files.Count -or
              $illegalStatus.Count -ne 0 -or
              @($actual | Where-Object { $_ -cnotin $allowed }).Count -ne 0) {
            throw "Merged maintenance PR must change one to three unique, non-renamed files from the exact verifier allowlist."
          }

          $encodedCheck = [Uri]::EscapeDataString("integration-green")
          $candidateSha = [string]$pull.head.sha
          $checks = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$repository/commits/$candidateSha/check-runs?check_name=$encodedCheck&filter=all&per_page=100" `
            -Headers $headers
          $baseSha = [string]$pull.base.sha
          $successPattern = "^control-plane-v2:$pullNumber`:$baseSha`:$candidateSha`:[0-9a-f]{64}:[0-9a-f]{64}$"
          $handoffPattern = "^control-plane-handoff-v1:$pullNumber`:$baseSha`:$candidateSha`:[0-9a-f]{64}$"
          $family = @(
            $checks.check_runs |
              Where-Object {
                $_.name -ceq "integration-green" -and
                $_.head_sha -ceq $candidateSha -and
                [long]$_.app.id -eq $appId -and
                ($_.external_id -cmatch $successPattern -or $_.external_id -cmatch $handoffPattern)
              } |
              Sort-Object -Property @{ Expression = { [long]$_.id } } -Descending
          )
          if ($family.Count -lt 1 -or
              $family[0].status -cne "completed" -or
              $family[0].conclusion -cne "success" -or
              $family[0].external_id -cnotmatch $successPattern) {
            throw "Newest App-owned maintenance check is not the successful certification for this exact head."
          }
          $authorizationSha = ([regex]::Match(
            [string]$family[0].external_id,
            '^control-plane-v2:[1-9][0-9]*:[0-9a-f]{40}:[0-9a-f]{40}:([0-9a-f]{64}):'
          )).Groups[1].Value
          if ($authorizationSha -cnotmatch '^[0-9a-f]{64}$') {
            throw "Merged maintenance certification does not expose its exact authorization commitment."
          }

          $main = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/commits/main" -Headers $headers
          if ([string]$main.sha -cnotmatch '^[0-9a-f]{40}$') {
            throw "Current main did not resolve to an immutable commit."
          }
          $compare = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$repository/compare/$($pull.merge_commit_sha)...$($main.sha)" `
            -Headers $headers
          if ($compare.status -notin @("identical", "ahead") -or
              [string]$compare.merge_base_commit.sha -cne [string]$pull.merge_commit_sha) {
            throw "Current main does not descend from the exact maintenance merge commit."
          }
          $dispatch = @{
            event_type = "verify-integrated-main"
            client_payload = @{
              integrated_sha = [string]$main.sha
              maintenance_pr = $pullNumber
              maintenance_head = $candidateSha
              authorization_sha256 = $authorizationSha
            }
          } | ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Method POST -Uri "https://api.github.com/repos/$repository/dispatches" `
            -Headers $headers -ContentType "application/json" -Body $dispatch | Out-Null
