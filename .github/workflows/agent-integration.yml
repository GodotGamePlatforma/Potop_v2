name: Agent integration executor

on:
  repository_dispatch:
    types:
      - verify-agent-candidate
      - verify-map-control-plane-candidate
      - verify-integrated-main

permissions:
  contents: read

concurrency:
  group: agent-integration-${{ github.event.client_payload.candidate_sha || github.event.client_payload.integrated_sha || github.sha || github.run_id }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_NAME: Godot_v4.7.1-stable_win64.exe.zip
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
  GODOT_ARCHIVE_SHA256: c7a289051eaefb460b0106b60e9cd5bee0ef55fd102dcb2bed1eb356cf3d90a1
  HEADLESS_SHARD_COUNT: "4"
  NATIVE_SHARD_COUNT: "1"

jobs:
  trust-preflight:
    name: Trusted exact-SHA preflight
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.preflight.outputs.mode }}
      target-sha: ${{ steps.preflight.outputs.target-sha }}
      base-sha: ${{ steps.preflight.outputs.base-sha }}
      branch: ${{ steps.preflight.outputs.branch }}
      pr-number: ${{ steps.preflight.outputs.pr-number }}
      check-run-id: ${{ steps.preflight.outputs.check-run-id }}
      authorization-sha256: ${{ steps.preflight.outputs.authorization-sha256 }}
      builder-sha256: ${{ steps.preflight.outputs.builder-sha256 }}
      portal-test-sha256: ${{ steps.preflight.outputs.portal-test-sha256 }}
      smoke-test-sha256: ${{ steps.preflight.outputs.smoke-test-sha256 }}
      evidence-sha256: ${{ steps.preflight.outputs.evidence-sha256 }}
    steps:
      - name: Check out trusted default-branch control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.base_sha || github.event.client_payload.integrated_sha || github.sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out the immutable target without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.candidate_sha || github.event.client_payload.integrated_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate exact PR, trusted tools, owner and protected paths
        id: preflight
        shell: pwsh
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REQUESTED_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          REQUESTED_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          REQUESTED_INTEGRATED_SHA: ${{ github.event.client_payload.integrated_sha }}
          REQUESTED_PR: ${{ github.event.client_payload.pr_number }}
          REQUESTED_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
          REQUESTED_LABEL: ${{ github.event.client_payload.required_label }}
          REQUESTED_AUTHORIZATION_SHA256: ${{ github.event.client_payload.authorization_sha256 }}
          REQUESTED_BUILDER_SHA256: ${{ github.event.client_payload.builder_sha256 }}
          REQUESTED_PORTAL_TEST_SHA256: ${{ github.event.client_payload.portal_test_sha256 }}
          REQUESTED_SMOKE_TEST_SHA256: ${{ github.event.client_payload.smoke_test_sha256 }}
          REQUESTED_EVIDENCE_SHA256: ${{ github.event.client_payload.evidence_sha256 }}
          EXPECTED_ATTESTER_APP_ID: ${{ vars.INTEGRATION_ATTESTER_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $repository = $env:GITHUB_REPOSITORY
          $trustedRepository = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRepository = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $requiredCheck = "integration-green"
          $requiredLabel = "integration-ready"
          $maintenanceLabel = "control-plane-reviewed"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Invoke-GitHubGet {
            param([Parameter(Mandatory = $true)][string]$Path)
            return Invoke-RestMethod -Method GET -Uri "https://api.github.com$Path" -Headers $headers
          }

          function Assert-CommitSha {
            param([Parameter(Mandatory = $true)][string]$Name, [AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{40}$') {
              throw "$Name must be a full lowercase Git SHA."
            }
          }

          function Assert-Sha256 {
            param([Parameter(Mandatory = $true)][string]$Name, [AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{64}$') {
              throw "$Name must be one lowercase SHA-256."
            }
          }

          $gitCommand = Get-Command -Name git.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $trustedGit = [System.IO.Path]::GetFullPath($gitCommand.Source)
          foreach ($untrustedRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $prefix = [System.IO.Path]::GetFullPath($untrustedRoot).TrimEnd([char[]]"\/") + [System.IO.Path]::DirectorySeparatorChar
            if ($trustedGit.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Git executable resolved inside an untrusted workspace: $trustedGit"
            }
          }
          $neutralCwd = Join-Path $env:RUNNER_TEMP "trusted-preflight-neutral-cwd"
          New-Item -ItemType Directory -Path $neutralCwd -Force | Out-Null
          if (@(Get-ChildItem -LiteralPath $neutralCwd -Force).Count -ne 0) {
            throw "Trusted preflight neutral working directory is not empty."
          }
          $env:CI_TRUSTED_GIT = $trustedGit

          function Invoke-GitChecked {
            param([Parameter(Mandatory = $true)][string]$Repository, [Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
            $value = (& $trustedGit -c "safe.directory=$Repository" -C $Repository @Arguments 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "git $($Arguments -join ' ') failed: $value"
            }
            return $value
          }

          $mode = ""
          $targetSha = ""
          $baseSha = ""
          $branch = "main"
          $pullNumber = 0
          $checkRunId = 0L
          $authorizationSha = "none"
          $builderSha = "none"
          $portalTestSha = "none"
          $smokeTestSha = "none"
          $evidenceSha = "none"
          $attesterAppId = 0L
          if (-not [long]::TryParse($env:EXPECTED_ATTESTER_APP_ID, [ref]$attesterAppId) -or $attesterAppId -lt 1) {
            throw "INTEGRATION_ATTESTER_APP_ID must be a positive numeric GitHub App ID."
          }

          if ($env:GITHUB_EVENT_NAME -ceq "repository_dispatch") {
            if ($env:EVENT_ACTION -in @("verify-agent-candidate", "verify-map-control-plane-candidate")) {
              $mode = if ($env:EVENT_ACTION -ceq "verify-agent-candidate") { "candidate" } else { "control-plane" }
              Assert-CommitSha -Name "base_sha" -Value $env:REQUESTED_BASE_SHA
              Assert-CommitSha -Name "candidate_sha" -Value $env:REQUESTED_CANDIDATE_SHA
              $baseSha = $env:REQUESTED_BASE_SHA
              $targetSha = $env:REQUESTED_CANDIDATE_SHA
              if (-not [int]::TryParse($env:REQUESTED_PR, [ref]$pullNumber) -or $pullNumber -lt 1) {
                throw "pr_number must be a positive integer."
              }
              if (-not [long]::TryParse($env:REQUESTED_CHECK_RUN_ID, [ref]$checkRunId) -or $checkRunId -lt 1) {
                throw "check_run_id must be a positive integer."
              }
              $expectedLabel = if ($mode -ceq "candidate") { $requiredLabel } else { $maintenanceLabel }
              if ($env:REQUESTED_LABEL -cne $expectedLabel) {
                throw "The dispatch did not preserve the trusted '$expectedLabel' label."
              }
              if ($mode -ceq "control-plane") {
                Assert-Sha256 -Name "authorization_sha256" -Value $env:REQUESTED_AUTHORIZATION_SHA256
                Assert-Sha256 -Name "builder_sha256" -Value $env:REQUESTED_BUILDER_SHA256
                Assert-Sha256 -Name "portal_test_sha256" -Value $env:REQUESTED_PORTAL_TEST_SHA256
                Assert-Sha256 -Name "smoke_test_sha256" -Value $env:REQUESTED_SMOKE_TEST_SHA256
                Assert-Sha256 -Name "evidence_sha256" -Value $env:REQUESTED_EVIDENCE_SHA256
                $authorizationSha = $env:REQUESTED_AUTHORIZATION_SHA256
                $builderSha = $env:REQUESTED_BUILDER_SHA256
                $portalTestSha = $env:REQUESTED_PORTAL_TEST_SHA256
                $smokeTestSha = $env:REQUESTED_SMOKE_TEST_SHA256
                $evidenceSha = $env:REQUESTED_EVIDENCE_SHA256
              }
            }
            elseif ($env:EVENT_ACTION -ceq "verify-integrated-main") {
              $mode = "main"
              Assert-CommitSha -Name "integrated_sha" -Value $env:REQUESTED_INTEGRATED_SHA
              $targetSha = $env:REQUESTED_INTEGRATED_SHA
              $baseSha = $targetSha
            }
            else {
              throw "Unsupported repository_dispatch action '$env:EVENT_ACTION'."
            }
          }
          else {
            throw "Only trusted repository_dispatch events may execute integration."
          }

          $trustedHead = Invoke-GitChecked -Repository $trustedRepository rev-parse "HEAD^{commit}"
          $candidateHead = Invoke-GitChecked -Repository $candidateRepository rev-parse "HEAD^{commit}"
          if ($trustedHead -cne $baseSha) {
            throw "Trusted checkout does not match the exact approved base."
          }
          if ($candidateHead -cne $targetSha) {
            throw "Candidate checkout does not match the exact requested SHA."
          }

          $currentMain = Invoke-GitHubGet -Path "/repos/$repository/commits/main"
          if ($currentMain.sha -cne $baseSha) {
            throw "main moved before trusted execution."
          }

          if ($mode -in @("candidate", "control-plane")) {
            $pullRequest = Invoke-GitHubGet -Path "/repos/$repository/pulls/$pullNumber"
            if ($pullRequest.state -cne "open" -or $pullRequest.draft) {
              throw "PR #$pullNumber must be open and non-draft."
            }
            if (
              $pullRequest.base.ref -cne "main" -or
              $pullRequest.base.sha -cne $baseSha -or
              $pullRequest.head.repo.full_name -cne $repository -or
              $pullRequest.head.sha -cne $targetSha
            ) {
              throw "PR #$pullNumber no longer matches the immutable handoff."
            }
            $branch = [string]$pullRequest.head.ref
            if ($branch -cnotmatch '^codex/(root|map|diver|integration|structure-[a-z0-9][a-z0-9_-]*)/[a-z0-9][a-z0-9._-]*$') {
              throw "PR #$pullNumber does not use a strict owner branch name."
            }
            if ($mode -ceq "control-plane" -and $branch -cnotmatch '^codex/map/[a-z0-9][a-z0-9._-]*$') {
              throw "Control-plane maintenance requires a strict codex/map task branch."
            }
            $labels = @($pullRequest.labels | ForEach-Object { [string]$_.name })
            $expectedLabel = if ($mode -ceq "candidate") { $requiredLabel } else { $maintenanceLabel }
            if ($expectedLabel -cnotin $labels) {
              throw "PR #$pullNumber is missing the '$expectedLabel' label."
            }

            $check = Invoke-GitHubGet -Path "/repos/$repository/check-runs/$checkRunId"
            $expectedExternalId = if ($mode -ceq "candidate") {
              "handoff-v2:$pullNumber`:$baseSha`:$targetSha"
            }
            else {
              "control-plane-handoff-v1:$pullNumber`:$baseSha`:$targetSha`:$authorizationSha"
            }
            if (
              $check.name -cne $requiredCheck -or
              $check.head_sha -cne $targetSha -or
              $check.external_id -cne $expectedExternalId -or
              [long]$check.app.id -ne $attesterAppId -or
              $check.status -notin @("queued", "in_progress")
            ) {
              throw "The requested check run is not bound to this exact handoff."
            }

            $pathMode = if ($mode -ceq "candidate") { "validate-diff" } else { "validate-map-maintenance-diff" }
            & python -I -B (Join-Path $trustedRepository "tools/ci_python_entry.py") `
              --cwd $neutralCwd --path-executable $trustedGit `
              --script (Join-Path $trustedRepository "tools/ci_protected_paths.py") -- $pathMode `
              --repo $candidateRepository --base $baseSha --head $targetSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & python -I -B (Join-Path $trustedRepository "tools/ci_python_entry.py") `
              --cwd $neutralCwd --path-executable $trustedGit `
              --script (Join-Path $trustedRepository "tools/ci_branch_owner.py") -- validate `
              --repo $candidateRepository `
              --branch $branch `
              --base-ref $baseSha `
              --expected-head $targetSha `
              --expected-base $baseSha `
              --contract-tool (Join-Path $trustedRepository "tools/workbench_contract.py")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            if ($mode -ceq "control-plane") {
              $actualBuilderSha = (Get-FileHash -LiteralPath (Join-Path $candidateRepository "underwater_map_workbench/tools/build_underwater_map.py") -Algorithm SHA256).Hash.ToLowerInvariant()
              $actualPortalSha = (Get-FileHash -LiteralPath (Join-Path $candidateRepository "underwater_map_workbench/tests/portal_backdrop_clearance_test.py") -Algorithm SHA256).Hash.ToLowerInvariant()
              $actualSmokeSha = (Get-FileHash -LiteralPath (Join-Path $candidateRepository "underwater_map_workbench/tests/underwater_map_smoke_test.gd") -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualBuilderSha -cne $builderSha -or
                  $actualPortalSha -cne $portalTestSha -or
                  $actualSmokeSha -cne $smokeTestSha) {
                throw "Authorized map verifier hashes differ from the exact candidate."
              }
              $authorizationPayload = "map-control-plane-authorization-v1`nrepo=$repository`npr=$pullNumber`nbase=$baseSha`nhead=$targetSha`nbuilder=$builderSha`nportal=$portalTestSha`nsmoke=$smokeTestSha`nevidence=$evidenceSha`n"
              $authorizationHasher = [System.Security.Cryptography.SHA256]::Create()
              try {
                $actualAuthorizationSha = [Convert]::ToHexString(
                  $authorizationHasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($authorizationPayload))
                ).ToLowerInvariant()
              }
              finally { $authorizationHasher.Dispose() }
              if ($actualAuthorizationSha -cne $authorizationSha) {
                throw "Control-plane authorization commitment does not match the exact candidate."
              }
            }
          }

          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target-sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base-sha=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pr-number=$pullNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "check-run-id=$checkRunId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "authorization-sha256=$authorizationSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "builder-sha256=$builderSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portal-test-sha256=$portalTestSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "smoke-test-sha256=$smokeTestSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "evidence-sha256=$evidenceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  infra-contracts:
    name: Infrastructure contracts
    needs:
      - trust-preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.base-sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.target-sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run infrastructure contracts
        shell: pwsh
        env:
          VERIFICATION_MODE: ${{ needs.trust-preflight.outputs.mode }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP "infra-contracts"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $logPath = Join-Path $evidenceRoot "infra-contracts.log"

          function Invoke-LoggedCommand {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][string]$Executable,
              [Parameter(Mandatory = $true)][string[]]$Arguments
            )
            "`n=== $Label ===" | Tee-Object -FilePath $logPath -Append
            & $Executable @Arguments *>&1 | Tee-Object -FilePath $logPath -Append
            $commandExitCode = $LASTEXITCODE
            "exit_code=$commandExitCode" | Tee-Object -FilePath $logPath -Append
            if ($commandExitCode -ne 0) {
              throw "$Label failed with exit code $commandExitCode."
            }
          }

          Invoke-LoggedCommand "LF contract" "python" @(
            "-I", "-B", (Join-Path $trustedRoot "tools/ci_python_entry.py"),
            "--preload", ("workbench_lock=" + (Join-Path $trustedRoot "tools/workbench_lock.py")),
            "--script", (Join-Path $trustedRoot "tools/workbench_contract.py"), "--",
            "--repo", $candidateRoot, "eol-check"
          )
          Invoke-LoggedCommand "workbench contract" "python" @("-I", "-B", (Join-Path $trustedRoot "tests/workbench_contract_test.py"))
          Invoke-LoggedCommand "workbench lock" "python" @("-I", "-B", (Join-Path $trustedRoot "tests/workbench_lock_test.py"))
          Invoke-LoggedCommand "freeze workbench revision" "python" @("-I", "-B", (Join-Path $trustedRoot "tests/freeze_workbench_revision_test.py"))
          Invoke-LoggedCommand "map atomic write" "python" @("-I", "-B", (Join-Path $trustedRoot "tests/map_atomic_write_test.py"))
          $portalContractRoot = if ($env:VERIFICATION_MODE -ceq "control-plane") {
            $candidateRoot
          }
          else {
            $trustedRoot
          }
          Invoke-LoggedCommand "portal backdrop clearance" "python" @(
            "-I", "-B", (Join-Path $portalContractRoot "underwater_map_workbench/tests/portal_backdrop_clearance_test.py")
          )
          Invoke-LoggedCommand "setup agent worktree" "pwsh" @(
            "-NoLogo", "-NoProfile", "-File", (Join-Path $trustedRoot "tests/setup_agent_worktree_test.ps1")
          )
          Invoke-LoggedCommand "runner isolation PS 7" "pwsh" @(
            "-NoLogo", "-NoProfile", "-File", (Join-Path $trustedRoot "tests/runner_isolation_test.ps1")
          )
          Invoke-LoggedCommand "runner isolation PS 5.1" "powershell.exe" @(
            "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            (Join-Path $trustedRoot "tests/runner_isolation_test.ps1")
          )

          $ciContractTests = @(
            Get-ChildItem -LiteralPath (Join-Path $trustedRoot "tests") -File -Filter "ci_*_test.py" |
              Sort-Object -Property Name
          )
          if ($ciContractTests.Count -eq 0) {
            throw "No CI contract tests were discovered."
          }
          foreach ($ciContractTest in $ciContractTests) {
            Invoke-LoggedCommand "CI contract: $($ciContractTest.Name)" "python" @(
              "-I", "-B", $ciContractTest.FullName
            )
          }
          Invoke-LoggedCommand "agent integration workflow contract" "python" @(
            "-I", "-B", (Join-Path $trustedRoot "tests/agent_integration_workflow_test.py")
          )

          $prePushTests = @(
            Get-ChildItem -LiteralPath (Join-Path $trustedRoot "tests") -Recurse -File |
              Where-Object {
                $_.BaseName -match "^pre[-_]?push.*test$" -and
                $_.Extension -in ".py", ".ps1"
              } |
              Sort-Object -Property FullName
          )
          foreach ($prePushTest in $prePushTests) {
            if ($prePushTest.Extension -eq ".py") {
              Invoke-LoggedCommand "pre-push: $($prePushTest.Name)" "python" @(
                "-I", "-B", $prePushTest.FullName
              )
            }
            else {
              Invoke-LoggedCommand "pre-push: $($prePushTest.Name)" "powershell.exe" @(
                "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
                $prePushTest.FullName
              )
            }
          }

      - name: Upload infrastructure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-contracts
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  prepare-godot:
    name: Prepare verified Godot archive
    needs:
      - trust-preflight
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.godot-key.outputs.value }}
    steps:
      - name: Define immutable Godot cache key
        id: godot-key
        shell: pwsh
        run: |
          "value=potop-godot-windows-$env:GODOT_VERSION-$env:GODOT_ARCHIVE_SHA256" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore immutable Godot archive cache
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/godot-archive
          key: ${{ steps.godot-key.outputs.value }}

      - name: Download on cache miss and always verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archiveRoot = Join-Path $env:RUNNER_TEMP "godot-archive"
          $archivePath = Join-Path $archiveRoot $env:GODOT_ARCHIVE_NAME
          New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null

          if ("${{ steps.godot-cache.outputs.cache-hit }}" -eq "true") {
            if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
              throw "Godot cache hit is missing the pinned archive."
            }
          }
          else {
            Invoke-WebRequest -Uri $env:GODOT_RELEASE_URL -OutFile $archivePath
          }

          $actualSha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -cne $env:GODOT_ARCHIVE_SHA256) {
            throw "Godot archive checksum mismatch. expected=$env:GODOT_ARCHIVE_SHA256 actual=$actualSha"
          }

  prepare-lfs-plan:
    name: Prepare exact candidate and shard plan
    needs:
      - trust-preflight
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      lfs-cache-key: ${{ steps.lfs-manifest.outputs.cache-key }}
      lfs-manifest-digest: ${{ steps.lfs-manifest.outputs.manifest-digest }}
      plan-artifact-id: ${{ steps.plan-artifact.outputs.artifact-id }}
      plan-artifact-digest: ${{ steps.plan-artifact.outputs.artifact-digest }}
    steps:
      - name: Check out trusted control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.base-sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.target-sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build canonical LFS manifest
        id: lfs-manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $planRoot = Join-Path $env:RUNNER_TEMP "ci-plan"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          New-Item -ItemType Directory -Path $planRoot -Force | Out-Null
          $manifestPath = Join-Path $planRoot "lfs-manifest.json"
          $manifestJson = python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") manifest --repo $candidateRoot --output $manifestPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $manifest = $manifestJson | ConvertFrom-Json
          "cache-key=potop-lfs-windows-v1-$($manifest.object_set_digest)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest-digest=$($manifest.manifest_digest)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore exact LFS object cache
        id: lfs-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/candidate/.git/lfs/objects
          key: ${{ steps.lfs-manifest.outputs.cache-key }}

      - name: Fetch the exact LFS object set on cache miss
        if: ${{ steps.lfs-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $exactHead = (git -C $candidateRoot rev-parse "HEAD^{commit}" | Out-String).Trim()
          if ($exactHead -cnotmatch '^[0-9a-f]{40}$') {
            throw "Candidate checkout did not resolve to an exact commit."
          }
          git -C $candidateRoot lfs fetch origin $exactHead
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify cache bytes and hydrate exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $manifestPath = Join-Path $env:RUNNER_TEMP "ci-plan\lfs-manifest.json"
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-cache --repo $candidateRoot --manifest $manifestPath --reject-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-worktree --repo $candidateRoot --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrEmpty((git -C $candidateRoot status --porcelain=v1 --untracked-files=all))) {
            throw "Hydrated candidate checkout is not clean."
          }

      - name: Create candidate receipt and immutable shard plan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $planRoot = Join-Path $env:RUNNER_TEMP "ci-plan"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $inputList = Join-Path $planRoot "candidate-inputs.list"
          $outputList = Join-Path $planRoot "candidate-outputs.list"
          $candidateReceipt = Join-Path $planRoot "candidate-receipt.json"
          $shardPlan = Join-Path $planRoot "shard-plan.receipt"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllLines($inputList, @("project.godot"), $utf8NoBom)
          [IO.File]::WriteAllLines(
            $outputList,
            @("underwater_map_workbench/UnderwaterMap.tscn"),
            $utf8NoBom
          )

          python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --preload ("workbench_lock=" + (Join-Path $trustedRoot "tools/workbench_lock.py")) `
            --script (Join-Path $trustedRoot "tools/workbench_contract.py") -- `
            --repo $candidateRoot publication create `
            --input-list $inputList `
            --output-list $outputList `
            --input-root project.godot `
            --output-root underwater_map_workbench/UnderwaterMap.tscn `
            --receipt $candidateReceipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          pwsh -NoLogo -NoProfile -File (Join-Path $trustedRoot "tests/run_all_tests.ps1") `
            -SourceRepositoryPath $candidateRoot `
            -Full `
            -HeadlessShardCount $env:HEADLESS_SHARD_COUNT `
            -NativeShardCount $env:NATIVE_SHARD_COUNT `
            -WriteShardPlan $shardPlan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-cache --repo $candidateRoot --manifest (Join-Path $planRoot "lfs-manifest.json") --reject-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable plan evidence
        id: plan-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  map-authority-check:
    name: Verify exact map authority
    needs:
      - trust-preflight
      - prepare-lfs-plan
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.map-check-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.map-check-artifact.outputs.artifact-digest }}
      map-receipt-sha256: ${{ steps.map-check-receipt.outputs.map-receipt-sha256 }}
    steps:
      - name: Check out trusted control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.base-sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.target-sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download immutable plan outside the candidate workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/ci-plan

      - name: Verify immutable plan artifact identity and digest
        shell: pwsh
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:EXPECTED_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "Plan artifact outputs are missing or malformed."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $artifact = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:EXPECTED_ARTIFACT_ID" `
            -Headers $headers
          $serviceDigest = ([string]$artifact.digest).ToLowerInvariant()
          if ($serviceDigest.StartsWith("sha256:")) { $serviceDigest = $serviceDigest.Substring(7) }
          if ([string]$artifact.id -cne $env:EXPECTED_ARTIFACT_ID -or
              [string]$artifact.name -cne "integration-plan-${{ github.run_id }}-${{ github.run_attempt }}" -or
              [bool]$artifact.expired -or
              [string]$artifact.workflow_run.id -cne "${{ github.run_id }}" -or
              $serviceDigest -cne $env:EXPECTED_ARTIFACT_DIGEST) {
            throw "Downloaded plan artifact does not match its immutable upload ID/digest."
          }

      - name: Restore exact LFS object cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/candidate/.git/lfs/objects
          key: ${{ needs.prepare-lfs-plan.outputs.lfs-cache-key }}
          fail-on-cache-miss: true

      - name: Verify LFS cache and hydrate candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $manifestPath = Join-Path $env:RUNNER_TEMP "ci-plan\lfs-manifest.json"
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-cache --repo $candidateRoot --manifest $manifestPath --reject-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-worktree --repo $candidateRoot --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrEmpty((git -C $candidateRoot status --porcelain=v1 --untracked-files=all))) {
            throw "Hydrated map-check candidate is not clean."
          }

      - name: Run trusted map check and create exact receipt
        id: map-check-receipt
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ needs.trust-preflight.outputs.target-sha }}
          VERIFICATION_MODE: ${{ needs.trust-preflight.outputs.mode }}
          AUTHORIZATION_SHA256: ${{ needs.trust-preflight.outputs.authorization-sha256 }}
          AUTHORIZED_BUILDER_SHA256: ${{ needs.trust-preflight.outputs.builder-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "map-authority-check"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $mapCheckLog = Join-Path $evidenceRoot "map-authority-check.log"
          $mapCheckReceipt = Join-Path $evidenceRoot "map-authority-check.receipt"
          $planPath = Join-Path $env:RUNNER_TEMP "ci-plan\shard-plan.receipt"
          $trustedMapFiles = @(
            "tools/workbench_contract.py",
            "tools/workbench_lock.py"
          )
          foreach ($relativePath in $trustedMapFiles) {
            $trustedPath = Join-Path $trustedRoot $relativePath
            $candidatePath = Join-Path $candidateRoot $relativePath
            if (-not (Test-Path -LiteralPath $trustedPath -PathType Leaf) -or
                -not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
              throw "Trusted map verifier dependency is missing: $relativePath"
            }
            $trustedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $trustedPath).Hash
            $candidateSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidatePath).Hash
            if ($candidateSha -cne $trustedSha) {
              throw "Candidate map verifier dependency differs from trusted control: $relativePath"
            }
          }

          $candidateBuilder = Join-Path $candidateRoot "underwater_map_workbench/tools/build_underwater_map.py"
          $trustedBuilder = Join-Path $trustedRoot "underwater_map_workbench/tools/build_underwater_map.py"
          if (-not (Test-Path -LiteralPath $candidateBuilder -PathType Leaf) -or
              -not (Test-Path -LiteralPath $trustedBuilder -PathType Leaf)) {
            throw "Map builder dependency is missing."
          }
          $candidateBuilderSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidateBuilder).Hash.ToLowerInvariant()
          if ($env:VERIFICATION_MODE -ceq "control-plane") {
            if ($env:AUTHORIZATION_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $env:AUTHORIZED_BUILDER_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $candidateBuilderSha -cne $env:AUTHORIZED_BUILDER_SHA256) {
              throw "Control-plane map builder does not match its exact authorization."
            }
          }
          else {
            $trustedBuilderSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $trustedBuilder).Hash.ToLowerInvariant()
            if ($candidateBuilderSha -cne $trustedBuilderSha -or $env:AUTHORIZATION_SHA256 -cne "none") {
              throw "Ordinary candidate map builder differs from trusted control."
            }
          }

          $candidateHead = (git -C $candidateRoot rev-parse "HEAD^{commit}" | Out-String).Trim()
          if ($candidateHead -cne $env:EXPECTED_HEAD_SHA) {
            throw "Map check candidate HEAD moved before verification."
          }
          $gitCommand = Get-Command -Name git.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $trustedGit = [System.IO.Path]::GetFullPath($gitCommand.Source)
          foreach ($untrustedRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $prefix = [System.IO.Path]::GetFullPath($untrustedRoot).TrimEnd([char[]]"\/") + [System.IO.Path]::DirectorySeparatorChar
            if ($trustedGit.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Git executable resolved inside an untrusted workspace: $trustedGit"
            }
          }
          $neutralCwd = Join-Path $env:RUNNER_TEMP "map-authority-neutral-cwd"
          New-Item -ItemType Directory -Path $neutralCwd -Force | Out-Null
          if (@(Get-ChildItem -LiteralPath $neutralCwd -Force).Count -ne 0) {
            throw "Map-check neutral working directory is not empty."
          }
          $env:CI_TRUSTED_GIT = $trustedGit
          & python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --preload ("workbench_lock=" + (Join-Path $trustedRoot "tools/workbench_lock.py")) `
            --preload ("workbench_contract=" + (Join-Path $trustedRoot "tools/workbench_contract.py")) `
            --script $candidateBuilder `
            -- --check *>&1 | Tee-Object -FilePath $mapCheckLog
          $mapCheckExitCode = $LASTEXITCODE
          if ($mapCheckExitCode -ne 0) {
            throw "Trusted map authority check failed with exit code $mapCheckExitCode."
          }
          if (-not [string]::IsNullOrEmpty((git -C $candidateRoot status --porcelain=v1 --untracked-files=all))) {
            throw "Trusted map authority check changed the exact candidate."
          }
          python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --script (Join-Path $trustedRoot "tools/ci_map_check_receipt.py") -- create `
            --repo $candidateRoot --plan $planPath --log $mapCheckLog --receipt $mapCheckReceipt `
            --authorization-sha256 $env:AUTHORIZATION_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --script (Join-Path $trustedRoot "tools/ci_map_check_receipt.py") -- verify `
            --repo $candidateRoot --plan $planPath --log $mapCheckLog --receipt $mapCheckReceipt `
            --authorization-sha256 $env:AUTHORIZATION_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mapReceiptSha = (Get-FileHash -LiteralPath $mapCheckReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mapReceiptSha -cnotmatch '^[0-9a-f]{64}$') {
            throw "Map-authority receipt SHA-256 is malformed."
          }
          "map-receipt-sha256=$mapReceiptSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload immutable map-check evidence
        id: map-check-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-authority-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/map-authority-check
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload failed map-check diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: map-authority-check-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/map-authority-check
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  shard:
    name: Shard ${{ matrix.shard_id }}
    needs:
      - trust-preflight
      - prepare-godot
      - prepare-lfs-plan
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard_id:
          - headless-0
          - headless-1
          - headless-2
          - headless-3
          - native-0
    steps:
      - name: Check out trusted control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.base-sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.target-sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download immutable plan outside the candidate workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/ci-plan

      - name: Verify immutable plan artifact identity and digest
        shell: pwsh
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:EXPECTED_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "Plan artifact outputs are missing or malformed."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $artifact = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:EXPECTED_ARTIFACT_ID" `
            -Headers $headers
          $serviceDigest = ([string]$artifact.digest).ToLowerInvariant()
          if ($serviceDigest.StartsWith("sha256:")) {
            $serviceDigest = $serviceDigest.Substring(7)
          }
          if ([string]$artifact.id -cne $env:EXPECTED_ARTIFACT_ID -or
              [string]$artifact.name -cne "integration-plan-${{ github.run_id }}-${{ github.run_attempt }}" -or
              [bool]$artifact.expired -or
              [string]$artifact.workflow_run.id -cne "${{ github.run_id }}" -or
              $serviceDigest -cne $env:EXPECTED_ARTIFACT_DIGEST) {
            throw "Downloaded plan artifact does not match its immutable upload ID/digest."
          }

      - name: Restore exact LFS object cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/candidate/.git/lfs/objects
          key: ${{ needs.prepare-lfs-plan.outputs.lfs-cache-key }}
          fail-on-cache-miss: true

      - name: Verify LFS cache and hydrate candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $manifestPath = Join-Path $env:RUNNER_TEMP "ci-plan\lfs-manifest.json"
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-cache --repo $candidateRoot --manifest $manifestPath --reject-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-worktree --repo $candidateRoot --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore verified Godot archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/godot-archive
          key: ${{ needs.prepare-godot.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install and verify Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archivePath = Join-Path $env:RUNNER_TEMP "godot-archive\$env:GODOT_ARCHIVE_NAME"
          $actualSha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -cne $env:GODOT_ARCHIVE_SHA256) {
            throw "Godot archive checksum mismatch. expected=$env:GODOT_ARCHIVE_SHA256 actual=$actualSha"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "godot-install"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installRoot
          $godotPath = Join-Path $installRoot "Godot_v4.7.1-stable_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godotPath -PathType Leaf)) {
            throw "Pinned Godot executable is missing."
          }
          $version = (& $godotPath --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version.StartsWith("4.7.1.stable")) {
            throw "Unexpected Godot version: $version"
          }
          "GODOT_CONSOLE_PATH=$godotPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run isolated shard and emit its receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $shardRoot = Join-Path $env:RUNNER_TEMP "test-shard-${{ matrix.shard_id }}"
          New-Item -ItemType Directory -Path $shardRoot -Force | Out-Null
          $receiptPath = Join-Path $shardRoot "${{ matrix.shard_id }}.receipt"
          $logPath = Join-Path $shardRoot "${{ matrix.shard_id }}.log"
          $planPath = Join-Path $env:RUNNER_TEMP "ci-plan\shard-plan.receipt"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"

          pwsh -NoLogo -NoProfile -File (Join-Path $trustedRoot "tests/run_all_tests.ps1") `
            -SourceRepositoryPath $candidateRoot `
            -GodotConsolePath $env:GODOT_CONSOLE_PATH `
            -ShardPlan $planPath `
            -ShardId "${{ matrix.shard_id }}" `
            -RunReceiptOutputPath $receiptPath *>&1 |
            Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-${{ matrix.shard_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  aggregate-attestation:
    name: Aggregate exact candidate evidence
    if: ${{ always() }}
    needs:
      - trust-preflight
      - infra-contracts
      - prepare-godot
      - prepare-lfs-plan
      - map-authority-check
      - shard
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-receipt-sha256: ${{ steps.receipt-hashes.outputs.candidate-receipt-sha256 }}
      aggregate-receipt-sha256: ${{ steps.receipt-hashes.outputs.aggregate-receipt-sha256 }}
      map-receipt-sha256: ${{ steps.receipt-hashes.outputs.map-receipt-sha256 }}
      receipt-set-sha256: ${{ steps.receipt-hashes.outputs.receipt-set-sha256 }}
      aggregate-canonical-sha256: ${{ steps.receipt-hashes.outputs.aggregate-canonical-sha256 }}
      artifact-digest: ${{ steps.attestation-artifact.outputs.artifact-digest }}
    steps:
      - name: Check out trusted control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.base-sha }}
          path: trusted-control
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out exact candidate without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust-preflight.outputs.target-sha }}
          path: candidate
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Fail closed on any incomplete dependency
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $aggregateRoot = Join-Path $env:RUNNER_TEMP "integration-aggregate"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          New-Item -ItemType Directory -Path $aggregateRoot -Force | Out-Null
          $needsPath = Join-Path $aggregateRoot "needs.json"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($needsPath, $env:CI_NEEDS_JSON, $utf8NoBom)
          python -I -B (Join-Path $trustedRoot "tools/ci_job_gate.py") verify-needs `
            --input $needsPath `
            --required trust-preflight infra-contracts prepare-godot prepare-lfs-plan map-authority-check shard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download immutable plan outside the candidate workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/ci-plan

      - name: Download immutable map-check receipt by exact artifact ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.map-authority-check.outputs.artifact-id }}
          path: ${{ runner.temp }}/ci-map-check

      - name: Verify immutable map-check artifact identity and digest
        shell: pwsh
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.map-authority-check.outputs.artifact-id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.map-authority-check.outputs.artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:EXPECTED_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "Map-check artifact outputs are missing or malformed."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $artifact = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:EXPECTED_ARTIFACT_ID" `
            -Headers $headers
          $serviceDigest = ([string]$artifact.digest).ToLowerInvariant()
          if ($serviceDigest.StartsWith("sha256:")) { $serviceDigest = $serviceDigest.Substring(7) }
          if ([string]$artifact.id -cne $env:EXPECTED_ARTIFACT_ID -or
              [string]$artifact.name -cne "map-authority-check-${{ github.run_id }}-${{ github.run_attempt }}" -or
              [bool]$artifact.expired -or
              [string]$artifact.workflow_run.id -cne "${{ github.run_id }}" -or
              $serviceDigest -cne $env:EXPECTED_ARTIFACT_DIGEST) {
            throw "Downloaded map-check artifact does not match its immutable upload ID/digest."
          }
          $runArtifacts = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/artifacts?per_page=100" `
            -Headers $headers
          if ([int]$runArtifacts.total_count -gt 100) {
            throw "Run has too many artifacts to prove unique map-check evidence."
          }
          $expectedName = "map-authority-check-${{ github.run_id }}-${{ github.run_attempt }}"
          $nameMatches = @($runArtifacts.artifacts | Where-Object { [string]$_.name -ceq $expectedName })
          if ($nameMatches.Count -ne 1) {
            throw "Expected exactly one map-check artifact named '$expectedName'; found $($nameMatches.Count)."
          }
          $namedDigest = ([string]$nameMatches[0].digest).ToLowerInvariant()
          if ($namedDigest.StartsWith("sha256:")) { $namedDigest = $namedDigest.Substring(7) }
          if ([string]$nameMatches[0].id -cne $env:EXPECTED_ARTIFACT_ID -or
              $namedDigest -cne $env:EXPECTED_ARTIFACT_DIGEST) {
            throw "Unique map-check artifact name does not resolve to the expected ID/digest."
          }

      - name: Resolve the exact immutable shard artifact IDs and digests
        id: shard-artifacts
        shell: pwsh
        env:
          EXPECTED_PLAN_ARTIFACT_ID: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-id }}
          EXPECTED_PLAN_ARTIFACT_DIGEST: ${{ needs.prepare-lfs-plan.outputs.plan-artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $runId = "${{ github.run_id }}"
          $attempt = "${{ github.run_attempt }}"
          $response = Invoke-RestMethod -Method GET `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts?per_page=100" `
            -Headers $headers
          $expectedNames = @(
            "test-shard-headless-0-$runId-$attempt",
            "test-shard-headless-1-$runId-$attempt",
            "test-shard-headless-2-$runId-$attempt",
            "test-shard-headless-3-$runId-$attempt",
            "test-shard-native-0-$runId-$attempt"
          )
          $records = [System.Collections.Generic.List[object]]::new()
          foreach ($expectedName in $expectedNames) {
            $matches = @($response.artifacts | Where-Object { [string]$_.name -ceq $expectedName })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one shard artifact '$expectedName'; found $($matches.Count)."
            }
            $artifact = $matches[0]
            $digest = ([string]$artifact.digest).ToLowerInvariant()
            if ($digest.StartsWith("sha256:")) { $digest = $digest.Substring(7) }
            if ([string]$artifact.id -notmatch '^[1-9][0-9]*$' -or
                $digest -notmatch '^[0-9a-f]{64}$' -or
                [bool]$artifact.expired -or
                [string]$artifact.workflow_run.id -cne $runId) {
              throw "Shard artifact '$expectedName' has invalid immutable service metadata."
            }
            $records.Add([ordered]@{
              name = $expectedName
              id = [string]$artifact.id
              digest = $digest
              size_in_bytes = [long]$artifact.size_in_bytes
            })
          }
          if ($env:EXPECTED_PLAN_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:EXPECTED_PLAN_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw "Plan artifact outputs are missing or malformed."
          }
          $planMatches = @($response.artifacts | Where-Object { [string]$_.id -ceq $env:EXPECTED_PLAN_ARTIFACT_ID })
          if ($planMatches.Count -ne 1) { throw "Exact plan artifact ID is missing from this run." }
          $planDigest = ([string]$planMatches[0].digest).ToLowerInvariant()
          if ($planDigest.StartsWith("sha256:")) { $planDigest = $planDigest.Substring(7) }
          if ([string]$planMatches[0].name -cne "integration-plan-$runId-$attempt" -or
              [bool]$planMatches[0].expired -or
              [string]$planMatches[0].workflow_run.id -cne $runId -or
              $planDigest -cne $env:EXPECTED_PLAN_ARTIFACT_DIGEST) {
            throw "Downloaded plan artifact does not match its immutable upload ID/digest."
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "integration-aggregate\shard-artifacts.json"
          $records | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          "artifact-ids=$([string]::Join(',', @($records | ForEach-Object id)))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download every shard receipt by exact immutable artifact ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.shard-artifacts.outputs.artifact-ids }}
          path: ${{ runner.temp }}/ci-shard-receipts

      - name: Restore exact LFS object cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/candidate/.git/lfs/objects
          key: ${{ needs.prepare-lfs-plan.outputs.lfs-cache-key }}
          fail-on-cache-miss: true

      - name: Verify LFS cache and hydrate candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $manifestPath = Join-Path $env:RUNNER_TEMP "ci-plan\lfs-manifest.json"
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-cache --repo $candidateRoot --manifest $manifestPath --reject-extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B (Join-Path $trustedRoot "tools/ci_lfs.py") verify-worktree --repo $candidateRoot --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify map-check receipt against exact candidate and plan
        shell: pwsh
        env:
          AUTHORIZATION_SHA256: ${{ needs.trust-preflight.outputs.authorization-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $planPath = Join-Path $env:RUNNER_TEMP "ci-plan\shard-plan.receipt"
          $evidenceFiles = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "ci-map-check") -Recurse -File)
          $receipts = @($evidenceFiles | Where-Object Name -ceq "map-authority-check.receipt")
          $logs = @($evidenceFiles | Where-Object Name -ceq "map-authority-check.log")
          if ($receipts.Count -ne 1 -or $logs.Count -ne 1 -or $evidenceFiles.Count -ne 2) {
            throw "Map-check evidence must contain exactly one receipt and one log."
          }
          $gitCommand = Get-Command -Name git.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $trustedGit = [System.IO.Path]::GetFullPath($gitCommand.Source)
          foreach ($untrustedRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            $prefix = [System.IO.Path]::GetFullPath($untrustedRoot).TrimEnd([char[]]"\/") + [System.IO.Path]::DirectorySeparatorChar
            if ($trustedGit.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Git executable resolved inside an untrusted workspace: $trustedGit"
            }
          }
          $neutralCwd = Join-Path $env:RUNNER_TEMP "aggregate-map-check-neutral-cwd"
          New-Item -ItemType Directory -Path $neutralCwd -Force | Out-Null
          if (@(Get-ChildItem -LiteralPath $neutralCwd -Force).Count -ne 0) {
            throw "Aggregate map-check neutral working directory is not empty."
          }
          $env:CI_TRUSTED_GIT = $trustedGit
          python -I -B (Join-Path $trustedRoot "tools/ci_python_entry.py") `
            --cwd $neutralCwd --path-executable $trustedGit `
            --script (Join-Path $trustedRoot "tools/ci_map_check_receipt.py") -- verify `
            --repo $candidateRoot --plan $planPath --log $logs[0].FullName --receipt $receipts[0].FullName `
            --authorization-sha256 $env:AUTHORIZATION_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Aggregate the exact full candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $aggregateRoot = Join-Path $env:RUNNER_TEMP "integration-aggregate"
          New-Item -ItemType Directory -Path $aggregateRoot -Force | Out-Null
          $aggregateReceipt = Join-Path $aggregateRoot "full-sharded.receipt"
          $aggregateLog = Join-Path $aggregateRoot "aggregate.log"
          $planPath = Join-Path $env:RUNNER_TEMP "ci-plan\shard-plan.receipt"
          $candidateReceipt = Join-Path $env:RUNNER_TEMP "ci-plan\candidate-receipt.json"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          $shardReceipts = @(
            Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "ci-shard-receipts") `
              -Recurse -File -Filter "*.receipt" | Sort-Object -Property Name | ForEach-Object FullName
          )
          if ($shardReceipts.Count -ne 5) {
            throw "Expected exactly five shard receipts; found $($shardReceipts.Count)."
          }

          & (Join-Path $trustedRoot "tests/run_all_tests.ps1") `
            -SourceRepositoryPath $candidateRoot `
            -ShardPlan $planPath `
            -AggregateShardReceipt $shardReceipts `
            -RunReceiptOutputPath $aggregateReceipt *>&1 |
            Tee-Object -FilePath $aggregateLog

      - name: Verify the aggregate against the fresh candidate receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $aggregateReceipt = Join-Path $env:RUNNER_TEMP "integration-aggregate\full-sharded.receipt"
          $aggregateLog = Join-Path $env:RUNNER_TEMP "integration-aggregate\aggregate.log"
          $candidateReceipt = Join-Path $env:RUNNER_TEMP "ci-plan\candidate-receipt.json"
          $trustedRoot = Join-Path $env:GITHUB_WORKSPACE "trusted-control"
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE "candidate"
          pwsh -NoLogo -NoProfile -File (Join-Path $trustedRoot "tests/run_all_tests.ps1") `
            -SourceRepositoryPath $candidateRoot `
            -VerifyRunReceipt $aggregateReceipt `
            -CandidateReceipt $candidateReceipt *>&1 |
            Tee-Object -FilePath $aggregateLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hash the fresh verified receipt set
        id: receipt-hashes
        shell: pwsh
        env:
          EXPECTED_MAP_RECEIPT_SHA256: ${{ needs.map-authority-check.outputs.map-receipt-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidateReceipt = Join-Path $env:RUNNER_TEMP "ci-plan\candidate-receipt.json"
          $aggregateReceipt = Join-Path $env:RUNNER_TEMP "integration-aggregate\full-sharded.receipt"
          $mapReceiptMatches = @(
            Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "ci-map-check") `
              -Recurse -File -Filter "map-authority-check.receipt"
          )
          if ($mapReceiptMatches.Count -ne 1) {
            throw "Expected exactly one verified map-authority receipt; found $($mapReceiptMatches.Count)."
          }
          $mapReceipt = $mapReceiptMatches[0].FullName
          foreach ($path in @($candidateReceipt, $aggregateReceipt, $mapReceipt)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Verified receipt is missing: $path"
            }
          }
          $candidateSha = (Get-FileHash -LiteralPath $candidateReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          $aggregateSha = (Get-FileHash -LiteralPath $aggregateReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          $mapSha = (Get-FileHash -LiteralPath $mapReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_MAP_RECEIPT_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $mapSha -cne $env:EXPECTED_MAP_RECEIPT_SHA256) {
            throw "Verified map-authority receipt differs from the producer's exact SHA-256."
          }
          $canonicalLine = Get-Content -LiteralPath $aggregateReceipt -TotalCount 1
          if ($canonicalLine -cnotmatch '^canonical_sha256=([0-9a-f]{64})$') {
            throw "Aggregate receipt has no canonical SHA-256 header."
          }
          $aggregateCanonicalSha = $Matches[1]
          $mapCanonicalLine = Get-Content -LiteralPath $mapReceipt -TotalCount 1
          if ($mapCanonicalLine -cnotmatch '^canonical_sha256=[0-9a-f]{64}$') {
            throw "Map-authority receipt has no canonical SHA-256 header."
          }
          $receiptSetPayload = "integration-receipt-set-v1`ncandidate=$candidateSha`naggregate=$aggregateSha`nmap=$mapSha`n"
          $receiptSetHasher = [System.Security.Cryptography.SHA256]::Create()
          try {
            $receiptSetSha = [Convert]::ToHexString(
              $receiptSetHasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($receiptSetPayload))
            ).ToLowerInvariant()
          }
          finally {
            $receiptSetHasher.Dispose()
          }
          "candidate-receipt-sha256=$candidateSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "aggregate-receipt-sha256=$aggregateSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "map-receipt-sha256=$mapSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "receipt-set-sha256=$receiptSetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "aggregate-canonical-sha256=$aggregateCanonicalSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload the verified attestation pair
        id: attestation-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-plan/candidate-receipt.json
            ${{ runner.temp }}/ci-plan/shard-plan.receipt
            ${{ runner.temp }}/ci-map-check/map-authority-check.receipt
            ${{ runner.temp }}/ci-map-check/map-authority-check.log
            ${{ runner.temp }}/integration-aggregate/full-sharded.receipt
            ${{ runner.temp }}/integration-aggregate/aggregate.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload failed aggregate diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-aggregate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-aggregate
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  publish-attestation:
    name: Publish trusted exact-SHA attestation
    if: ${{ always() }}
    needs:
      - trust-preflight
      - infra-contracts
      - prepare-godot
      - prepare-lfs-plan
      - map-authority-check
      - shard
      - aggregate-attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: integration-attester
    permissions: {}
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      target-sha: ${{ steps.publish.outputs.target-sha }}
      base-sha: ${{ steps.publish.outputs.base-sha }}
      pr-number: ${{ steps.publish.outputs.pr-number }}
      check-run-id: ${{ steps.publish.outputs.check-run-id }}
      candidate-receipt-sha256: ${{ steps.publish.outputs.candidate-receipt-sha256 }}
      aggregate-receipt-sha256: ${{ steps.publish.outputs.aggregate-receipt-sha256 }}
      map-receipt-sha256: ${{ steps.publish.outputs.map-receipt-sha256 }}
      receipt-set-sha256: ${{ steps.publish.outputs.receipt-set-sha256 }}
      external-id: ${{ steps.publish.outputs.external-id }}
    steps:
      - name: Mint repository-scoped attester token
        id: attester-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INTEGRATION_ATTESTER_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_ATTESTER_PRIVATE_KEY }}
          permission-checks: write
      - name: Publish the only integration-green Check Run
        id: publish
        shell: pwsh
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REQUESTED_BASE_SHA: ${{ github.event.client_payload.base_sha }}
          REQUESTED_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
          REQUESTED_INTEGRATED_SHA: ${{ github.event.client_payload.integrated_sha }}
          REQUESTED_PR: ${{ github.event.client_payload.pr_number }}
          REQUESTED_CHECK_RUN_ID: ${{ github.event.client_payload.check_run_id }}
          REQUESTED_AUTHORIZATION_SHA256: ${{ github.event.client_payload.authorization_sha256 }}
          PREFLIGHT_RESULT: ${{ needs.trust-preflight.result }}
          INFRA_RESULT: ${{ needs.infra-contracts.result }}
          GODOT_RESULT: ${{ needs.prepare-godot.result }}
          PLAN_RESULT: ${{ needs.prepare-lfs-plan.result }}
          MAP_CHECK_RESULT: ${{ needs.map-authority-check.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate-attestation.result }}
          ATTESTED_CANDIDATE_RECEIPT_SHA256: ${{ needs.aggregate-attestation.outputs.candidate-receipt-sha256 }}
          ATTESTED_AGGREGATE_RECEIPT_SHA256: ${{ needs.aggregate-attestation.outputs.aggregate-receipt-sha256 }}
          ATTESTED_MAP_RECEIPT_SHA256: ${{ needs.aggregate-attestation.outputs.map-receipt-sha256 }}
          ATTESTED_RECEIPT_SET_SHA256: ${{ needs.aggregate-attestation.outputs.receipt-set-sha256 }}
          ATTESTED_AGGREGATE_CANONICAL_SHA256: ${{ needs.aggregate-attestation.outputs.aggregate-canonical-sha256 }}
          ATTESTED_ARTIFACT_DIGEST: ${{ needs.aggregate-attestation.outputs.artifact-digest }}
          EXPECTED_ATTESTER_APP_ID: ${{ vars.INTEGRATION_ATTESTER_APP_ID }}
          ATTESTER_TOKEN: ${{ steps.attester-token.outputs.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repository = $env:GITHUB_REPOSITORY
          $requiredCheck = "integration-green"
          $detailsUrl = "$env:GITHUB_SERVER_URL/$repository/actions/runs/$env:GITHUB_RUN_ID"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:ATTESTER_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Invoke-GitHubApi {
            param(
              [Parameter(Mandatory = $true)][ValidateSet("GET", "POST", "PATCH")][string]$Method,
              [Parameter(Mandatory = $true)][string]$Path,
              [AllowNull()][object]$Body = $null
            )
            $parameters = @{
              Method = $Method
              Uri = "https://api.github.com$Path"
              Headers = $headers
            }
            if ($null -ne $Body) {
              $parameters.ContentType = "application/json"
              $parameters.Body = $Body | ConvertTo-Json -Depth 12 -Compress
            }
            return Invoke-RestMethod @parameters
          }

          function Assert-CommitSha {
            param([string]$Name, [AllowEmptyString()][string]$Value)
            if ($Value -cnotmatch '^[0-9a-f]{40}$') {
              throw "$Name must be a full lowercase Git SHA."
            }
          }

          $results = [ordered]@{
            preflight = $env:PREFLIGHT_RESULT
            infrastructure = $env:INFRA_RESULT
            godot_archive = $env:GODOT_RESULT
            plan = $env:PLAN_RESULT
            map_authority = $env:MAP_CHECK_RESULT
            shards = $env:SHARD_RESULT
            aggregate = $env:AGGREGATE_RESULT
          }
          $allSucceeded = @($results.Values | Where-Object { $_ -cne "success" }).Count -eq 0
          $resultText = ($results.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join "; "

          $mode = ""
          $targetSha = ""
          $baseSha = ""
          $pullNumber = 0
          $checkRunId = 0L
          $attesterAppId = 0L
          if (-not [long]::TryParse($env:EXPECTED_ATTESTER_APP_ID, [ref]$attesterAppId) -or $attesterAppId -lt 1) {
            throw "INTEGRATION_ATTESTER_APP_ID must be a positive numeric GitHub App ID."
          }
          if ($env:GITHUB_EVENT_NAME -ceq "repository_dispatch" -and
              $env:EVENT_ACTION -in @("verify-agent-candidate", "verify-map-control-plane-candidate")) {
            $mode = if ($env:EVENT_ACTION -ceq "verify-agent-candidate") { "candidate" } else { "control-plane" }
            Assert-CommitSha -Name "base_sha" -Value $env:REQUESTED_BASE_SHA
            Assert-CommitSha -Name "candidate_sha" -Value $env:REQUESTED_CANDIDATE_SHA
            $baseSha = $env:REQUESTED_BASE_SHA
            $targetSha = $env:REQUESTED_CANDIDATE_SHA
            if (-not [int]::TryParse($env:REQUESTED_PR, [ref]$pullNumber) -or $pullNumber -lt 1) {
              throw "pr_number must be a positive integer."
            }
            if (-not [long]::TryParse($env:REQUESTED_CHECK_RUN_ID, [ref]$checkRunId) -or $checkRunId -lt 1) {
              throw "check_run_id must be a positive integer."
            }
            if ($mode -ceq "control-plane" -and $env:REQUESTED_AUTHORIZATION_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
              throw "authorization_sha256 must be one lowercase SHA-256."
            }
          }
          elseif ($env:GITHUB_EVENT_NAME -ceq "repository_dispatch" -and $env:EVENT_ACTION -ceq "verify-integrated-main") {
            $mode = "main"
            $targetSha = $env:REQUESTED_INTEGRATED_SHA
            Assert-CommitSha -Name "integrated main SHA" -Value $targetSha
            $baseSha = $targetSha
          }
          else {
            throw "Unsupported publisher event."
          }

          $candidateReceiptSha = $env:ATTESTED_CANDIDATE_RECEIPT_SHA256
          $aggregateReceiptSha = $env:ATTESTED_AGGREGATE_RECEIPT_SHA256
          $mapReceiptSha = $env:ATTESTED_MAP_RECEIPT_SHA256
          $receiptSetSha = $env:ATTESTED_RECEIPT_SET_SHA256
          $aggregateCanonicalSha = $env:ATTESTED_AGGREGATE_CANONICAL_SHA256
          $artifactDigest = $env:ATTESTED_ARTIFACT_DIGEST
          if ($allSucceeded) {
            foreach ($entry in ([ordered]@{
              candidate_receipt = $candidateReceiptSha
              aggregate_receipt = $aggregateReceiptSha
              map_receipt = $mapReceiptSha
              receipt_set = $receiptSetSha
              aggregate_canonical = $aggregateCanonicalSha
              artifact = $artifactDigest
            }).GetEnumerator()) {
              if ($entry.Value -cnotmatch '^[0-9a-f]{64}$') {
                throw "$($entry.Key) digest is missing or malformed after a green aggregate."
              }
            }
            $receiptSetPayload = "integration-receipt-set-v1`ncandidate=$candidateReceiptSha`naggregate=$aggregateReceiptSha`nmap=$mapReceiptSha`n"
            $receiptSetHasher = [System.Security.Cryptography.SHA256]::Create()
            try {
              $recomputedReceiptSetSha = [Convert]::ToHexString(
                $receiptSetHasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($receiptSetPayload))
              ).ToLowerInvariant()
            }
            finally {
              $receiptSetHasher.Dispose()
            }
            if ($receiptSetSha -cne $recomputedReceiptSetSha) {
              throw "Receipt-set commitment does not match the three verified receipt hashes."
            }
          }

          if ($mode -in @("candidate", "control-plane")) {
            $check = Invoke-GitHubApi -Method GET -Path "/repos/$repository/check-runs/$checkRunId"
            $handoffExternalId = if ($mode -ceq "candidate") {
              "handoff-v2:$pullNumber`:$baseSha`:$targetSha"
            }
            else {
              "control-plane-handoff-v1:$pullNumber`:$baseSha`:$targetSha`:$($env:REQUESTED_AUTHORIZATION_SHA256)"
            }
            if (
              $check.name -cne $requiredCheck -or
              $check.head_sha -cne $targetSha -or
              $check.external_id -cne $handoffExternalId -or
              [long]$check.app.id -ne $attesterAppId -or
              $check.status -notin @("queued", "in_progress")
            ) {
              throw "Publisher refused a check that is not bound to the exact queued handoff."
            }

            $controlSetSha = "none"
            if ($allSucceeded -and $mode -ceq "control-plane") {
              $controlSetPayload = "control-plane-receipt-set-v1`nauthorization=$($env:REQUESTED_AUTHORIZATION_SHA256)`nreceipts=$receiptSetSha`n"
              $controlSetHasher = [System.Security.Cryptography.SHA256]::Create()
              try {
                $controlSetSha = [Convert]::ToHexString(
                  $controlSetHasher.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($controlSetPayload))
                ).ToLowerInvariant()
              }
              finally { $controlSetHasher.Dispose() }
            }
            $externalId = if (-not $allSucceeded) {
              $handoffExternalId
            }
            elseif ($mode -ceq "candidate") {
              "candidate-v3:$repository`:$pullNumber`:$baseSha`:$targetSha`:$receiptSetSha"
            }
            else {
              "control-plane-v2:$pullNumber`:$baseSha`:$targetSha`:$($env:REQUESTED_AUTHORIZATION_SHA256)`:$controlSetSha"
            }
            if ($externalId.Length -gt 255) { throw "Candidate/control-plane external_id exceeds the GitHub Checks limit." }
            $conclusion = if ($allSucceeded) { "success" } else { "failure" }
            $title = if ($allSucceeded -and $mode -ceq "control-plane") {
              "Exact map verifier update is certified for human merge"
            }
            elseif ($allSucceeded) { "Exact candidate is fully verified" }
            else { "Exact candidate verification failed" }
            $summary = "$resultText. mode=$mode; exact_head=$targetSha; authorization=$($env:REQUESTED_AUTHORIZATION_SHA256); candidate_receipt=$candidateReceiptSha; aggregate_receipt=$aggregateReceiptSha; map_receipt=$mapReceiptSha; receipt_set=$receiptSetSha; control_set=$controlSetSha; aggregate_canonical=$aggregateCanonicalSha; artifact=$artifactDigest."
            Invoke-GitHubApi -Method PATCH -Path "/repos/$repository/check-runs/$checkRunId" -Body @{
              external_id = $externalId
              details_url = $detailsUrl
              status = "completed"
              conclusion = $conclusion
              completed_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
              output = @{ title = $title; summary = $summary }
            } | Out-Null
          }
          else {
            $externalId = if ($allSucceeded) {
              "main-lkg-v3:$targetSha`:$receiptSetSha"
            }
            else {
              "main-lkg-v3:$targetSha`:failed`:$env:GITHUB_RUN_ID"
            }
            if ($externalId.Length -gt 255) { throw "Main external_id exceeds the GitHub Checks limit." }
            $conclusion = if ($allSucceeded) { "success" } else { "failure" }
            $title = if ($allSucceeded) { "Exact main LKG is fully verified" } else { "Exact main verification failed" }
            $summary = "$resultText. exact_main=$targetSha; candidate_receipt=$candidateReceiptSha; aggregate_receipt=$aggregateReceiptSha; map_receipt=$mapReceiptSha; receipt_set=$receiptSetSha; aggregate_canonical=$aggregateCanonicalSha; artifact=$artifactDigest."
            $encoded = [Uri]::EscapeDataString($requiredCheck)
            $existingResponse = Invoke-GitHubApi -Method GET -Path "/repos/$repository/commits/$targetSha/check-runs?check_name=$encoded&filter=all&per_page=100"
            $mainPattern = "^main-lkg-v3:$($targetSha):(?:[0-9a-f]{64}|failed:[0-9]+)$"
            $existing = @(
              $existingResponse.check_runs |
                Where-Object {
                  $_.name -ceq $requiredCheck -and
                  $_.head_sha -ceq $targetSha -and
                  [long]$_.app.id -eq $attesterAppId -and
                  $_.external_id -cmatch $mainPattern
                } |
                Sort-Object -Property @{ Expression = { [long]$_.id } } -Descending
            )
            $checkBody = @{
              external_id = $externalId
              details_url = $detailsUrl
              status = "completed"
              conclusion = $conclusion
              completed_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
              output = @{ title = $title; summary = $summary }
            }
            if ($existing.Count -gt 0) {
              $checkRunId = [long]$existing[0].id
              $publishedCheck = Invoke-GitHubApi -Method PATCH -Path "/repos/$repository/check-runs/$checkRunId" -Body $checkBody
            }
            else {
              $checkBody.name = $requiredCheck
              $checkBody.head_sha = $targetSha
              $publishedCheck = Invoke-GitHubApi -Method POST -Path "/repos/$repository/check-runs" -Body $checkBody
              $checkRunId = [long]$publishedCheck.id
            }
            if (
              $publishedCheck.name -cne $requiredCheck -or
              $publishedCheck.head_sha -cne $targetSha -or
              $publishedCheck.external_id -cne $externalId -or
              [long]$publishedCheck.app.id -ne $attesterAppId -or
              $publishedCheck.status -cne "completed" -or
              $publishedCheck.conclusion -cne $conclusion
            ) { throw "Dedicated attester did not return the exact main check." }
          }

          if (-not $allSucceeded) {
            throw "Trusted integration attestation failed: $resultText"
          }

          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target-sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base-sha=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pr-number=$pullNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "check-run-id=$checkRunId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate-receipt-sha256=$candidateReceiptSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "aggregate-receipt-sha256=$aggregateReceiptSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "map-receipt-sha256=$mapReceiptSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "receipt-set-sha256=$receiptSetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "external-id=$externalId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  dispatch-completion:
    name: Dispatch verified candidate completion
    if: ${{ always() && needs.publish-attestation.result == 'success' && needs.publish-attestation.outputs.mode == 'candidate' }}
    needs:
      - publish-attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: write
    steps:
      - name: Recheck the exact successful check and dispatch completion
        shell: pwsh
        env:
          MODE: ${{ needs.publish-attestation.outputs.mode }}
          TARGET_SHA: ${{ needs.publish-attestation.outputs.target-sha }}
          BASE_SHA: ${{ needs.publish-attestation.outputs.base-sha }}
          PR_NUMBER: ${{ needs.publish-attestation.outputs.pr-number }}
          CHECK_RUN_ID: ${{ needs.publish-attestation.outputs.check-run-id }}
          RECEIPT_SET_SHA256: ${{ needs.publish-attestation.outputs.receipt-set-sha256 }}
          EXTERNAL_ID: ${{ needs.publish-attestation.outputs.external-id }}
          EXPECTED_ATTESTER_APP_ID: ${{ vars.INTEGRATION_ATTESTER_APP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:MODE -cne "candidate") { throw "Completion dispatch is candidate-only." }
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:BASE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "Completion dispatch received a malformed exact SHA."
          }
          if ($env:RECEIPT_SET_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "Completion dispatch received a malformed attested receipt digest."
          }
          $pullNumber = 0
          $checkRunId = 0L
          $attesterAppId = 0L
          if (-not [int]::TryParse($env:PR_NUMBER, [ref]$pullNumber) -or $pullNumber -lt 1) { throw "Invalid PR number." }
          if (-not [long]::TryParse($env:CHECK_RUN_ID, [ref]$checkRunId) -or $checkRunId -lt 1) { throw "Invalid check run ID." }
          if (-not [long]::TryParse($env:EXPECTED_ATTESTER_APP_ID, [ref]$attesterAppId) -or $attesterAppId -lt 1) {
            throw "INTEGRATION_ATTESTER_APP_ID must be a positive numeric GitHub App ID."
          }
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repository = $env:GITHUB_REPOSITORY
          $check = Invoke-RestMethod -Method GET -Uri "https://api.github.com/repos/$repository/check-runs/$checkRunId" -Headers $headers
          if (
            $check.name -cne "integration-green" -or
            $check.head_sha -cne $env:TARGET_SHA -or
            $check.external_id -cne $env:EXTERNAL_ID -or
            [long]$check.app.id -ne $attesterAppId -or
            $check.status -cne "completed" -or
            $check.conclusion -cne "success"
          ) {
            throw "Completion dispatch refused a non-matching integration-green check."
          }
          $body = @{
            event_type = "complete-agent-handoff"
            client_payload = @{
              pr_number = $pullNumber
              base_sha = $env:BASE_SHA
              candidate_sha = $env:TARGET_SHA
              check_run_id = $checkRunId
              receipt_set_sha256 = $env:RECEIPT_SET_SHA256
            }
          } | ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Method POST -Uri "https://api.github.com/repos/$repository/dispatches" -Headers $headers -ContentType "application/json" -Body $body | Out-Null
