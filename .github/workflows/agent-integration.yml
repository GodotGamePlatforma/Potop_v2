name: Full regression after merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-regression-main-latest
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_NAME: Godot_v4.7.1-stable_win64.exe.zip
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
  GODOT_ARCHIVE_SHA256: c7a289051eaefb460b0106b60e9cd5bee0ef55fd102dcb2bed1eb356cf3d90a1
  HEADLESS_SHARD_COUNT: "4"
  NATIVE_SHARD_COUNT: "1"

jobs:
  exact-main:
    name: Bind run to merged SHA
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify immutable push identity
        shell: pwsh
        env:
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "Full regression accepts only push events for refs/heads/main."
          }
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:PUSH_AFTER -cne $env:GITHUB_SHA) {
            throw "Push event is not bound to one exact merged SHA."
          }
          $head = (git rev-parse "HEAD^{commit}" | Out-String).Trim()
          if ($head -cne $env:GITHUB_SHA) { throw "Checkout HEAD differs from the push SHA." }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Exact-main checkout is not clean."
          }

  infrastructure:
    name: Infrastructure regression
    needs: exact-main
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run complete infrastructure contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B tools/workbench_contract.py --repo . eol-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonTests = @(
            "tests/workbench_contract_test.py",
            "tests/workbench_lock_test.py",
            "tests/freeze_workbench_revision_test.py",
            "tests/map_atomic_write_test.py",
            "underwater_map_workbench/tests/portal_backdrop_clearance_test.py",
            "tests/agent_integration_workflow_test.py"
          ) + @(
            Get-ChildItem -LiteralPath tests -File -Filter "ci_*_test.py" |
              Sort-Object -Property Name | ForEach-Object FullName
          )
          foreach ($test in $pythonTests) {
            python -I -B $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in @(
            "tests/setup_agent_worktree_test.ps1",
            "tests/runner_isolation_test.ps1",
            "tests/publish_agent_pr_test.ps1",
            "tests/sync_play_main_test.ps1"
          )) {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  prepare-godot:
    name: Prepare verified Godot
    needs: exact-main
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.godot-key.outputs.value }}
    steps:
      - name: Define immutable Godot cache key
        id: godot-key
        shell: pwsh
        run: |
          "value=potop-godot-windows-$env:GODOT_VERSION-$env:GODOT_ARCHIVE_SHA256" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore immutable Godot archive cache
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/godot-archive
          key: ${{ steps.godot-key.outputs.value }}

      - name: Download on cache miss and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archiveRoot = Join-Path $env:RUNNER_TEMP "godot-archive"
          $archivePath = Join-Path $archiveRoot $env:GODOT_ARCHIVE_NAME
          New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
          if ("${{ steps.godot-cache.outputs.cache-hit }}" -ne "true") {
            Invoke-WebRequest -Uri $env:GODOT_RELEASE_URL -OutFile $archivePath
          }
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Pinned Godot archive is missing."
          }
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GODOT_ARCHIVE_SHA256) {
            throw "Godot archive checksum mismatch. expected=$env:GODOT_ARCHIVE_SHA256 actual=$actual"
          }

  prepare-plan:
    name: Prepare exact full-test plan
    needs: exact-main
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Hydrate exact LFS objects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git lfs fetch origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create immutable shard plan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $planRoot = Join-Path $env:RUNNER_TEMP "full-plan"
          New-Item -ItemType Directory -Path $planRoot -Force | Out-Null
          & .\tests\run_all_tests.ps1 `
            -SourceRepositoryPath $env:GITHUB_WORKSPACE `
            -Full `
            -HeadlessShardCount $env:HEADLESS_SHARD_COUNT `
            -NativeShardCount $env:NATIVE_SHARD_COUNT `
            -WriteShardPlan (Join-Path $planRoot "shard-plan.receipt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload immutable shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-plan/shard-plan.receipt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  map-authority:
    name: Map authority regression
    needs: exact-main
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Hydrate exact LFS objects and verify generated map
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git lfs fetch origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B underwater_map_workbench/tools/build_underwater_map.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Map authority check changed the exact merged source."
          }

  shard:
    name: Full ${{ matrix.shard_id }}
    needs:
      - exact-main
      - prepare-godot
      - prepare-plan
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard_id:
          - headless-0
          - headless-1
          - headless-2
          - headless-3
          - native-0
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Download immutable shard plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: full-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-plan

      - name: Hydrate exact LFS objects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git lfs fetch origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore verified Godot archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/godot-archive
          key: ${{ needs.prepare-godot.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install and verify Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archivePath = Join-Path $env:RUNNER_TEMP "godot-archive\$env:GODOT_ARCHIVE_NAME"
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GODOT_ARCHIVE_SHA256) { throw "Godot archive checksum mismatch." }
          $installRoot = Join-Path $env:RUNNER_TEMP "godot-install"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installRoot
          $godot = Join-Path $installRoot "Godot_v4.7.1-stable_win64_console.exe"
          $version = (& $godot --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version.StartsWith("4.7.1.stable")) {
            throw "Unexpected Godot version: $version"
          }
          "GODOT_CONSOLE_PATH=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run isolated shard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "full-shard-${{ matrix.shard_id }}"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          & .\tests\run_all_tests.ps1 `
            -SourceRepositoryPath $env:GITHUB_WORKSPACE `
            -GodotConsolePath $env:GODOT_CONSOLE_PATH `
            -ShardPlan (Join-Path $env:RUNNER_TEMP "full-plan\shard-plan.receipt") `
            -ShardId "${{ matrix.shard_id }}" `
            -RunReceiptOutputPath (Join-Path $evidence "${{ matrix.shard_id }}.receipt") *>&1 |
            Tee-Object -FilePath (Join-Path $evidence "${{ matrix.shard_id }}.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-shard-${{ matrix.shard_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-shard-${{ matrix.shard_id }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  full-regression:
    name: full-regression
    if: ${{ always() }}
    needs:
      - exact-main
      - infrastructure
      - prepare-godot
      - prepare-plan
      - map-authority
      - shard
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Fail on any incomplete background lane
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = "Stop"
          $needs = $env:NEEDS_JSON | ConvertFrom-Json
          $failed = @(
            $needs.PSObject.Properties |
              Where-Object { [string]$_.Value.result -cne "success" } |
              ForEach-Object { "$($_.Name)=$($_.Value.result)" }
          )
          if ($failed.Count -gt 0) {
            "## Full regression failed for $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "Failed lanes: $([string]::Join(', ', $failed))" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            throw "Incomplete full regression: $([string]::Join(', ', $failed))"
          }

      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Download immutable shard plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: full-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-plan

      - name: Download all shard receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: full-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-shards
          merge-multiple: true

      - name: Hydrate exact LFS objects and aggregate receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git lfs fetch origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs fsck --objects --pointers --dry-run HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipts = @(
            Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "full-shards") `
              -Recurse -File -Filter "*.receipt" |
              Sort-Object -Property Name | ForEach-Object FullName
          )
          if ($receipts.Count -ne 5) { throw "Expected five shard receipts; found $($receipts.Count)." }
          $aggregateRoot = Join-Path $env:RUNNER_TEMP "full-regression"
          New-Item -ItemType Directory -Path $aggregateRoot -Force | Out-Null
          & .\tests\run_all_tests.ps1 `
            -SourceRepositoryPath $env:GITHUB_WORKSPACE `
            -ShardPlan (Join-Path $env:RUNNER_TEMP "full-plan\shard-plan.receipt") `
            -AggregateShardReceipt $receipts `
            -RunReceiptOutputPath (Join-Path $aggregateRoot "full-sharded.receipt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "## Full regression passed for $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload aggregate report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-regression
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
