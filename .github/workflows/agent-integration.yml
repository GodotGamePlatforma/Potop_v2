name: Merge-group integration

on:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: merge-group-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  GODOT_VERSION: 4.7.1-stable
  GODOT_ARCHIVE_NAME: Godot_v4.7.1-stable_win64.exe.zip
  GODOT_RELEASE_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
  GODOT_ARCHIVE_SHA256: c7a289051eaefb460b0106b60e9cd5bee0ef55fd102dcb2bed1eb356cf3d90a1

jobs:
  integration-shards:
    name: integration-shard-${{ matrix.slot }}
    runs-on: potop-windows-16core-64gb
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slot: 1-of-2
            headless_shard: headless-0
            run_native: false
          - slot: 2-of-2
            headless_shard: headless-1
            run_native: true
    steps:
      - name: Check out the exact merge-group candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify exact candidate and hydrate every tracked LFS object
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $env:EXPECTED_HEAD) {
            throw "Checkout is not the exact merge-group SHA. expected=$env:EXPECTED_HEAD actual=$actualHead"
          }
          if (-not [string]::IsNullOrEmpty((git status --porcelain=v1 --untracked-files=all))) {
            throw "Merge-group checkout is not clean."
          }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          listing = json.loads(subprocess.run(
              ["git", "lfs", "ls-files", "--json"],
              check=True,
              capture_output=True,
          ).stdout)
          pointers = []
          header = b"version https://git-lfs.github.com/spec/v1"
          for entry in listing["files"]:
              relative = entry["name"]
              candidate = root / pathlib.PurePosixPath(relative)
              if not entry.get("checkout", False) or not candidate.is_file():
                  pointers.append(relative)
                  continue
              with candidate.open("rb") as handle:
                  if handle.read(len(header)) == header:
                      pointers.append(relative)
          if pointers:
              raise SystemExit("Tracked LFS pointers remain unhydrated: " + ", ".join(pointers))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create the exact three-shard plan
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "integration-shard-evidence"
          [void](New-Item -ItemType Directory -Path $evidenceDirectory -Force)
          $planPath = Join-Path $evidenceDirectory "shard-plan.receipt"
          & ./tests/run_all_tests.ps1 `
            -SourceRepositoryPath . `
            -Full `
            -WriteShardPlan $planPath `
            -HeadlessShardCount 2 `
            -NativeShardCount 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP $env:GODOT_ARCHIVE_NAME
          $install = Join-Path $env:RUNNER_TEMP "godot-integration"
          Invoke-WebRequest -Uri $env:GODOT_RELEASE_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:GODOT_ARCHIVE_SHA256) {
            throw "Godot archive checksum mismatch. expected=$env:GODOT_ARCHIVE_SHA256 actual=$actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          $godot = Join-Path $install "Godot_v4.7.1-stable_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Pinned Godot executable is missing."
          }
          "GODOT_CONSOLE_PATH=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the assigned headless shard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headlessShard = "${{ matrix.headless_shard }}"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "integration-shard-evidence"
          $planPath = Join-Path $evidenceDirectory "shard-plan.receipt"
          $receiptPath = Join-Path $evidenceDirectory "$headlessShard.receipt"
          & ./tests/run_all_tests.ps1 `
            -GodotConsolePath $env:GODOT_CONSOLE_PATH `
            -SourceRepositoryPath . `
            -ShardPlan $planPath `
            -ShardId $headlessShard `
            -RunReceiptOutputPath $receiptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the required native shard on job 2
        if: ${{ matrix.run_native }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "integration-shard-evidence"
          $planPath = Join-Path $evidenceDirectory "shard-plan.receipt"
          $receiptPath = Join-Path $evidenceDirectory "native-0.receipt"
          & ./tests/run_all_tests.ps1 `
            -GodotConsolePath $env:GODOT_CONSOLE_PATH `
            -SourceRepositoryPath . `
            -ShardPlan $planPath `
            -ShardId "native-0" `
            -RunReceiptOutputPath $receiptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  integration-green:
    name: integration-green
    needs:
      - integration-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require both paid shard jobs to pass
        shell: bash
        env:
          SHARD_JOBS_RESULT: ${{ needs.integration-shards.result }}
        run: |
          if [ "$SHARD_JOBS_RESULT" != "success" ]; then
            echo "One or both integration shard jobs did not pass: $SHARD_JOBS_RESULT" >&2
            exit 1
          fi
          echo "integration-green PASS: both paid shard jobs completed successfully"

  fast-check:
    name: fast-check
    needs:
      - integration-green
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Release the required queue check only after full integration
        shell: bash
        env:
          INTEGRATION_RESULT: ${{ needs.integration-green.result }}
        run: |
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "integration-green did not pass: $INTEGRATION_RESULT" >&2
            exit 1
          fi
          echo "integration-green PASS; merge-group fast-check PASS"
